name: Bump deployed app cache key
on:
  push:
    branches: [chore/bust-app-cache-v141]
    paths: [.github/workflows/bump-app-cache-v141.yml]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/bust-app-cache-v141
          fetch-depth: 0
      - name: Advance the app module cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = '<script type="module" src="./app.js?v=140"></script>'
          new = '<script type="module" src="./app.js?v=141"></script>'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one app cache key, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -F './app.js?v=141' index.html
          git diff --check
      - name: Commit the cache-key bump
        run: |
          rm .github/workflows/bump-app-cache-v141.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bump app module cache key to v141"
          git push origin HEAD:chore/bust-app-cache-v141
