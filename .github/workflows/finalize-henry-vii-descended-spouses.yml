name: Finalize Henry VII-descended spouse expansion
on:
  push:
    branches: [data/henry-vii-descended-spouses]
    paths: [.github/workflows/finalize-henry-vii-descended-spouses.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/henry-vii-descended-spouses
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Complete the data expansion if the first verifier did not commit it
        run: |
          if ! grep -q '"version": 29' data/british-royal-line.json; then
            python3 .github/scripts/resolve_henry_vii_spouse_branch_ids.py
            python3 .github/scripts/expand_henry_vii_descended_spouses.py
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/henry-vii-descended-spouses.test.mjs')
          if path.exists():
              text = path.read_text()
              text = text.replace("assertSpousePairDescends('Mary, Queen of Scots', 'Lord Darnley', descendants);", "assertSpousePairDescends('Mary Stuart, Queen of Scots', 'Lord Darnley', descendants);")
              path.write_text(text)
          PY
      - name: Run the complete automated suite
        run: |
          npm test
          node --check app.js
          node --check royal-title-style.js
          python3 -m json.tool data/british-royal-line.json >/dev/null
          git diff --check
      - name: Re-run the browser migration when the first verifier had not reached it
        run: |
          if [ -f .github/scripts/check_henry_vii_descended_spouses.mjs ]; then
            python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
            for attempt in $(seq 1 50); do
              curl -fsS http://127.0.0.1:4173/ >/dev/null && break
              sleep .1
            done
            CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
            test -n "$CHROME_BIN"
            "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
              --user-data-dir=/tmp/lineage-descended-spouses-final about:blank \
              >/tmp/lineage-chrome.log 2>&1 &
            node .github/scripts/check_henry_vii_descended_spouses.mjs http://127.0.0.1:4173/ 9222
          fi
      - name: Commit a clean verified branch
        run: |
          rm -f .github/scripts/audit_henry_vii_descended_spouses.py
          rm -f .github/scripts/resolve_spouse_ancestor_geni_ids.py
          rm -f .github/scripts/resolve_henry_vii_spouse_branch_ids.py
          rm -f .github/scripts/expand_henry_vii_descended_spouses.py
          rm -f .github/scripts/check_henry_vii_descended_spouses.mjs
          rm -f .github/henry-vii-spouse-audit.txt
          rm -f .github/spouse-ancestor-geni-ids.json
          rm -f .github/henry-vii-spouse-branch-ids.json
          rm -f .github/workflows/audit-henry-vii-descended-spouses.yml
          rm -f .github/workflows/persist-henry-vii-spouse-audit.yml
          rm -f .github/workflows/resolve-spouse-ancestor-geni-ids.yml
          rm -f .github/workflows/verify-henry-vii-descended-spouses.yml
          rm -f .github/workflows/finalize-henry-vii-descended-spouses.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Connect spouses descended from Henry VII" || exit 0
          git push origin HEAD:data/henry-vii-descended-spouses
