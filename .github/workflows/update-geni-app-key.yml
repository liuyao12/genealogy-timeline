name: Update Geni application key

on:
  push:
    branches:
      - fix/geni-app-key

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/geni-app-key
          fetch-depth: 0

      - name: Replace the stale public application key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "Ks7E8mCtICOvVRpmvreTwOZdb4uMIiKNqRmF81II"
          new = "zgW8WYPaAaGlYDbHFDhXfJosKALeFPUPczL7Q4bK"
          paths = [Path("index.html"), Path("docs/geni-import.md")]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one old key in {path}, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          grep -F 'content="zgW8WYPaAaGlYDbHFDhXfJosKALeFPUPczL7Q4bK"' index.html
          grep -F 'content="zgW8WYPaAaGlYDbHFDhXfJosKALeFPUPczL7Q4bK"' docs/geni-import.md
          ! grep -R -F 'Ks7E8mCtICOvVRpmvreTwOZdb4uMIiKNqRmF81II' index.html docs/geni-import.md

      - name: Verify existing tests
        run: npm test

      - name: Commit the verified key correction
        shell: bash
        run: |
          rm .github/workflows/update-geni-app-key.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/geni-import.md .github/workflows/update-geni-app-key.yml
          git commit -m "Use the registered Geni application key"
          git push origin HEAD:fix/geni-app-key
