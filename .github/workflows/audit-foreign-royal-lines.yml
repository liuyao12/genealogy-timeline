name: Audit foreign royal lines
on:
  push:
    branches: [audit/foreign-royal-lines-2026-09-10]
    paths:
      - .github/scripts/audit_foreign_royal_lines.py
      - .github/workflows/audit-foreign-royal-lines.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/foreign-royal-lines-2026-09-10
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate audit
        run: |
          python3 -m py_compile .github/scripts/audit_foreign_royal_lines.py
          python3 .github/scripts/audit_foreign_royal_lines.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/foreign-royal-lines.md audit/foreign-royal-lines.json
          git diff --cached --quiet && exit 0
          git commit -m "Record foreign royal-line audit [skip ci]"
          git push origin HEAD:audit/foreign-royal-lines-2026-09-10
