name: Persist Henry VII spouse ancestry audit
on:
  push:
    branches: [data/henry-vii-descended-spouses]
    paths: [.github/workflows/persist-henry-vii-spouse-audit.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/henry-vii-descended-spouses
          fetch-depth: 0
      - name: Audit spouse ancestry in bundled example
        run: python3 .github/scripts/audit_henry_vii_descended_spouses.py > .github/henry-vii-spouse-audit.txt
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/henry-vii-spouse-audit.txt
          git commit -m "Record Henry VII spouse ancestry audit"
          git push origin HEAD:data/henry-vii-descended-spouses
