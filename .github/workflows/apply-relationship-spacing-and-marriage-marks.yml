name: Apply relationship spacing and complete marriage marks

on:
  push:
    branches:
      - fix/relationship-spacing-and-marriage-marks

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/relationship-spacing-and-marriage-marks
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply layout and marriage-marker changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')

          replacements = []

          replacements.append((
          '''function timelineVerticalSeparation(firstIndex, secondIndex, nodes, rowStep) {
            const unrelatedExtraGutter = 6;
            return rowStep + (timelineNodesAreImmediateFamily(nodes[firstIndex], nodes[secondIndex]) ? 0 : unrelatedExtraGutter);
          }''',
          '''function timelineVerticalSeparation(firstIndex, secondIndex, nodes, rowStep) {
            // Direct relatives retain the ordinary six-pixel row gutter. People
            // with no direct relationship—such as two spouses of one person—
            // receive a visibly wider separation without becoming hard blocks.
            const unrelatedExtraGutter = 10;
            return rowStep + (timelineNodesAreImmediateFamily(nodes[firstIndex], nodes[secondIndex]) ? 0 : unrelatedExtraGutter);
          }'''
          ))

          replacements.append((
          '''  nodes.forEach((_, index) => {
            const currentRun = directRuns.at(-1);
            const previousIndex = currentRun?.at(-1);
            const previousOwner = previousIndex == null ? '' : displayParentByKey.get(nodes[previousIndex].key);
            const currentOwner = displayParentByKey.get(nodes[index].key);
            const sharesMarriageOwner = previousIndex != null
              && nodes[previousIndex].isSpouse
              && nodes[index].isSpouse
              && previousOwner
              && previousOwner === currentOwner;
            if (previousIndex != null && (timelineNodesAreImmediateFamily(nodes[previousIndex], nodes[index]) || sharesMarriageOwner)) currentRun.push(index);
            else directRuns.push([index]);
          });''',
          '''  nodes.forEach((_, index) => {
            const currentRun = directRuns.at(-1);
            const previousIndex = currentRun?.at(-1);
            // Co-spouses are not directly related to one another. Keeping them
            // in separate runs lets the ordinary compactor preserve the wider
            // unrelated-person gutter while still reusing open vertical space.
            if (previousIndex != null && timelineNodesAreImmediateFamily(nodes[previousIndex], nodes[index])) currentRun.push(index);
            else directRuns.push([index]);
          });'''
          ))

          replacements.append((
          '''      (siblingHouseholdConstraints.get(index) || []).forEach(precedingIndexes => {
                const placedIndexes = precedingIndexes.filter(other => !offsetByIndex.has(other) && placedSet.has(other));
                if (placedIndexes.length) targetTop = Math.max(targetTop, Math.max(...placedIndexes.map(other => nodes[other].y)) + rowStep - offset);
              });''',
          '''      (siblingHouseholdConstraints.get(index) || []).forEach(precedingIndexes => {
                const placedIndexes = precedingIndexes.filter(other => !offsetByIndex.has(other) && placedSet.has(other));
                if (placedIndexes.length) {
                  const dependencyBottom = Math.max(...placedIndexes.map(other =>
                    nodes[other].y + timelineVerticalSeparation(index, other, nodes, rowStep)
                  ));
                  targetTop = Math.max(targetTop, dependencyBottom - offset);
                }
              });'''
          ))

          replacements.append((
          '''  const expandableIds = new Set(visibleIds);
            const renderedPartnerIds = id => scopedSpouseIds(state.people[id], scope).filter(partnerId => renderedPartnerPairs.has(partnerRelationKey(id, partnerId)));
            // Collapse paths, not people.''',
          '''  const expandableIds = new Set(visibleIds);
            const renderedPartnerIds = id => scopedSpouseIds(state.people[id], scope).filter(partnerId => renderedPartnerPairs.has(partnerRelationKey(id, partnerId)));
            // Build one symmetric index of every dated formal marriage retained in
            // the local graph. It deliberately includes spouses outside the active
            // descendant projection: their profiles stay hidden, but the marriage
            // date remains part of the visible person's life history.
            const formalMarriagePartnersByPerson = new Map();
            const addFormalMarriagePartner = (firstId, secondId) => {
              if (!state.people[firstId] || !state.people[secondId] || firstId === secondId) return;
              if (!formalMarriagePartnersByPerson.has(firstId)) formalMarriagePartnersByPerson.set(firstId, new Set());
              formalMarriagePartnersByPerson.get(firstId).add(secondId);
            };
            Object.values(state.people).forEach(person => {
              unique([
                ...(person.spouses || []),
                ...(person.divorcedSpouses || []),
                ...Object.keys(person.marriageYears || {})
              ]).forEach(partnerId => {
                if (!state.people[partnerId] || marriageYearFor(person.id, partnerId) == null) return;
                addFormalMarriagePartner(person.id, partnerId);
                addFormalMarriagePartner(partnerId, person.id);
              });
            });
            const formalMarriagePartnerIds = id => [...(formalMarriagePartnersByPerson.get(id) || [])]
              .sort((firstId, secondId) =>
                (marriageYearFor(id, firstId) ?? Number.POSITIVE_INFINITY)
                  - (marriageYearFor(id, secondId) ?? Number.POSITIVE_INFINITY)
                || visibleName(state.people[firstId]).localeCompare(visibleName(state.people[secondId]))
              );
            // Collapse paths, not people.'''
          ))

          replacements.append((
          '''        marriageOverlaysByParent.get(parentKey).push({
                  x: trunkX,
                  year: recordedMarriageYear,
                  className: marriageClass,
                  title: `Married ${visibleName(state.people[parentIds.find(id => id !== parentId)])} in ${recordedMarriageYear}`
                });''',
          '''        const partnerId = parentIds.find(id => id !== parentId);
                marriageOverlaysByParent.get(parentKey).push({
                  x: trunkX,
                  year: recordedMarriageYear,
                  partnerId,
                  className: marriageClass,
                  title: `Married ${visibleName(state.people[partnerId])} in ${recordedMarriageYear}`
                });'''
          ))

          for old, new in replacements:
              if app.count(old) != 1:
                  raise SystemExit(f'Expected exactly one app.js replacement target; found {app.count(old)} for:\n{old[:180]}')
              app = app.replace(old, new)

          start_marker = '''    // Marriage stems cross above both spouse boxes, including their borders,'''
          end_marker = '''    const childrenShownAtAnotherOccurrence = transportedChildrenByNatalId.get(id) || new Set();'''
          start = app.index(start_marker)
          end = app.index(end_marker, start)
          overlay_replacement = '''    // Marriage stems cross above both spouse boxes, including their borders,
            // so each stem reads as one uninterrupted line down to its children. Text
            // and controls are painted afterward to remain legible and interactive.
            const displayedMarriagePartners = new Set();
            (marriageOverlaysByParent.get(nodeKey) || []).forEach(marriage => {
              const localX = marriage.x - pos.x;
              if (localX < 0 || localX > lifespanWidth) return;
              const overlay = svg('line', {
                class: `timeline-edge marriage-node-overlay vertical ${marriage.className}`,
                x1: localX, y1: 0, x2: localX, y2: rowHeight,
                'data-marriage-year': marriage.year,
                'data-partner-id': marriage.partnerId || ''
              });
              overlay.append(svg('title', {}, marriage.title));
              group.append(overlay);
              if (marriage.partnerId) displayedMarriagePartners.add(marriage.partnerId);
            });
            // Every visual occurrence of a person carries every known formal
            // marriage date. The one union physically paired to this occurrence
            // keeps its continuous stem; the other dates remain short markers in
            // the lifespan bar, whether paired elsewhere or outside this tree.
            formalMarriagePartnerIds(id).forEach(partnerId => {
              if (displayedMarriagePartners.has(partnerId)) return;
              const partner = state.people[partnerId];
              const marriageYear = marriageYearFor(id, partnerId);
              if (!partner || marriageYear == null) return;
              const localX = (marriageYear - birthYear(person)) * yearWidth;
              if (localX < 0 || localX > lifespanWidth) return;
              const pairKey = partnerRelationKey(id, partnerId);
              const pairedElsewhere = renderedPartnerPairs.has(pairKey);
              const isDivorced = marriageIsDivorced([id, partnerId]);
              const marker = svg('line', {
                class: `timeline-edge additional-marriage-marker vertical${isDivorced ? ' divorced' : ''}`,
                x1: localX, y1: 0, x2: localX, y2: rowHeight,
                'data-marriage-year': marriageYear,
                'data-partner-id': partnerId,
                'data-paired-elsewhere': pairedElsewhere ? 'true' : 'false'
              });
              marker.append(svg('title', {}, `Married ${visibleName(partner)} in ${marriageYear}; ${pairedElsewhere ? 'paired at another occurrence' : 'spouse not shown in this descendant tree'}`));
              group.append(marker);
            });
          '''
          app = app[:start] + overlay_replacement + app[end:]
          app_path.write_text(app, encoding='utf-8')

          styles_path = Path('styles.css')
          styles = styles_path.read_text(encoding='utf-8')
          old_style = '.timeline-edge.unconnected-marriage-marker { stroke: #fff; stroke-width: 1.5; pointer-events: none; }'
          new_style = '.timeline-edge.additional-marriage-marker { stroke: #fff; stroke-width: 1.5; pointer-events: none; }'
          if styles.count(old_style) != 1:
              raise SystemExit(f'Expected one old marriage-marker style; found {styles.count(old_style)}')
          styles_path.write_text(styles.replace(old_style, new_style), encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          for old, new in [
              ('./styles.css?v=68', './styles.css?v=69'),
              ('./app.js?v=121', './app.js?v=122')
          ]:
              if index.count(old) != 1:
                  raise SystemExit(f'Expected one cache key {old}; found {index.count(old)}')
              index = index.replace(old, new)
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Run tests and syntax checks
        run: |
          npm test
          node --check app.js

      - name: Verify gaps and complete marriage marks in Chromium
        shell: bash
        run: |
          cat > __relationship_smoke.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <iframe id="app" src="./index.html" style="width:1500px;height:1000px"></iframe>
          <pre id="result">WAIT</pre>
          <script>
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function waitFor(check) {
            for (let i = 0; i < 180; i += 1) { const value = check(); if (value) return value; await sleep(100); }
            throw new Error('timeout');
          }
          (async () => {
            const result = document.getElementById('result');
            try {
              const frame = document.getElementById('app');
              await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
              const doc = frame.contentDocument;
              await waitFor(() => doc.querySelector('.timeline-node'));
              const filter = doc.getElementById('tree-filter');
              filter.value = '';
              filter.dispatchEvent(new Event('input', { bubbles: true }));
              await sleep(1600);

              const ids = {
                margaret: 'profile-g6000000003858820967',
                jamesIV: 'profile-g4229916861440069622',
                archibald: 'profile-g6000000003232538566',
                henryStewart: 'profile-g6000000005412245713',
                henryVIII: 'profile-g6000000007442241030',
                catherine: 'profile-4475169'
              };
              const y = id => {
                const node = doc.querySelector(`.timeline-node[data-node-key="${id}"]`);
                const match = /translate\([^ ,]+[ ,]+([^)]+)\)/.exec(node?.getAttribute('transform') || '');
                return match ? Number(match[1]) : NaN;
              };
              const rows = Object.fromEntries(Object.entries(ids).map(([name, id]) => [name, y(id)]));
              const directGap = rows.jamesIV - rows.margaret;
              const coSpouseGap = rows.henryStewart - rows.archibald;
              const widerCoSpouseGap = Number.isFinite(directGap) && Number.isFinite(coSpouseGap)
                && coSpouseGap >= directGap + 8;
              const compactionPreserved = rows.henryVIII < 1200;

              const data = await fetch('./data/british-royal-line.json').then(response => response.json());
              const marriagePartners = id => Object.keys(data.people[id]?.marriageYears || {});
              const nodeMarriagePartners = node => new Set([...node.querySelectorAll('line[data-marriage-year][data-partner-id]')]
                .map(line => line.getAttribute('data-partner-id')).filter(Boolean));
              const catherineExpected = marriagePartners(ids.catherine);
              const catherineNodes = [...doc.querySelectorAll(`.timeline-node[data-person-id="${ids.catherine}"]`)];
              const catherineShowsEveryMarriage = catherineNodes.length >= 2
                && catherineExpected.length >= 2
                && catherineNodes.every(node => catherineExpected.every(partnerId => nodeMarriagePartners(node).has(partnerId)));
              const henryNode = doc.querySelector(`.timeline-node[data-node-key="${ids.henryVIII}"]`);
              const henryExpected = marriagePartners(ids.henryVIII);
              const henryPartners = nodeMarriagePartners(henryNode);
              const henryShowsEveryMarriage = henryExpected.length === 6
                && henryExpected.every(partnerId => henryPartners.has(partnerId));

              const checks = { widerCoSpouseGap, compactionPreserved, catherineShowsEveryMarriage, henryShowsEveryMarriage };
              const pass = Object.values(checks).every(Boolean);
              result.textContent = `${pass ? 'PASS' : 'FAIL'} ${JSON.stringify({
                checks, rows, directGap, coSpouseGap,
                catherineOccurrences: catherineNodes.length,
                catherineExpected,
                catherineActual: catherineNodes.map(node => [...nodeMarriagePartners(node)]),
                henryExpected,
                henryActual: [...henryPartners]
              })}`;
            } catch (error) { result.textContent = `FAIL ${error.stack || error}`; }
          })();
          </script>
          HTML

          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=30000 --dump-dom http://127.0.0.1:4173/__relationship_smoke.html >/tmp/relationship-smoke.html
          grep -oE '(PASS|FAIL) [^<]*' /tmp/relationship-smoke.html | head -1
          grep -q 'PASS {' /tmp/relationship-smoke.html
          rm __relationship_smoke.html

      - name: Commit verified changes
        shell: bash
        run: |
          rm .github/workflows/apply-relationship-spacing-and-marriage-marks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Separate unrelated nodes and show every marriage mark"
          git push origin HEAD:fix/relationship-spacing-and-marriage-marks
