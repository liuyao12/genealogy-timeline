name: Apply strict household block ordering

on:
  push:
    branches:
      - fix/strict-household-block-order

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-household-block-order
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply layout and palette changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')

          # Replace the old two-pass layout (all spouses, then all children)
          # with one depth-first block per chronological marriage.
          start_marker = '    // Lay out the immediate marriage household before descending into any'
          end_marker = '\n\n    renderedPartnerIds(id)'
          start = app.index(start_marker)
          end = app.index(end_marker, start)
          replacement = '''    // Render each marriage as one chronological block: the spouse first,
              // then that union's children and all of their descendant subtrees, before
              // moving to the next spouse. This keeps successive households legible.
              const groupedPartners = new Set();
              orderedGroups.forEach(group => {
                const transportedId = group.partnerId ? transportedParent([id, group.partnerId]) : '';
                const pendingChildren = group.childIds.filter(childId => !expanded.has(childId));
                let householdParentId = id;

                // A cousin-marriage household is rendered on the non-transported side.
                // The transported spouse retains a primary occurrence in the natal
                // branch and receives an auxiliary occurrence for this marriage.
                if (group.partnerId && transportedId !== id) {
                  groupedPartners.add(group.partnerId);
                  if (!transportedId) {
                    const partnerWasPlaced = placed.has(group.partnerId);
                    place(group.partnerId, true, id);
                    if (partnerWasPlaced && state.collapsedIds.has(group.partnerId)) spouseIds.add(group.partnerId);
                    if (!partnerWasPlaced) householdParentId = group.partnerId;
                  }
                }

                // When this person is the transported side of a cousin marriage, the
                // other surviving lineage occurrence owns the shared child subtree.
                if (transportedId === id) return;
                pendingChildren.forEach(childId => visit(childId, householdParentId));
              });'''
          app = app[:start] + replacement + app[end:]

          # Insert a transported spouse immediately before that union's child
          # subtree, rather than after every spouse belonging to the owner.
          insert_function = app.index('  const insertTransportedOccurrence =')
          insert_start_marker = '    const otherParentIndex = layoutEntries.findIndex(entry => entry.key === otherParentId);'
          insert_end_marker = '    layoutEntries.splice(insertAt, 0, '
          insert_start = app.index(insert_start_marker, insert_function)
          insert_end = app.index(insert_end_marker, insert_start)
          insert_replacement = '''    const otherParentIndex = layoutEntries.findIndex(entry => entry.key === otherParentId);
              const marriageYear = marriageYearFor(otherParentId, transportedId) ?? Number.POSITIVE_INFINITY;
              const spouseSlots = layoutEntries.map((entry, index) => ({
                entry,
                index,
                ownerId: displayParentByKey.get(entry.key),
                marriageYear: marriageYearFor(otherParentId, entry.id) ?? Number.POSITIVE_INFINITY
              })).filter(slot => slot.entry.isSpouse && slot.ownerId === otherParentId);
              const laterSpouse = spouseSlots.find(slot => slot.marriageYear > marriageYear);
              const firstFamilyChildIndex = family.children
                .map(childId => layoutEntries.findIndex(entry => entry.key === childId))
                .filter(index => index >= 0)
                .sort((a, b) => a - b)[0] ?? -1;
              const isInsideOwnerBranch = entryKey => {
                let currentKey = entryKey;
                const seen = new Set();
                while (currentKey && !seen.has(currentKey)) {
                  if (currentKey === otherParentId) return true;
                  seen.add(currentKey);
                  currentKey = displayParentByKey.get(currentKey) || '';
                }
                return false;
              };
              let ownerBranchEnd = layoutEntries.findIndex((entry, index) =>
                index > otherParentIndex && !isInsideOwnerBranch(entry.key)
              );
              if (ownerBranchEnd < 0) ownerBranchEnd = layoutEntries.length;
              const insertAt = firstFamilyChildIndex >= 0
                ? firstFamilyChildIndex
                : laterSpouse
                  ? laterSpouse.index
                  : ownerBranchEnd;
          '''
          app = app[:insert_start] + insert_replacement + app[insert_end:]

          # The compactor used to let later sibling branches rise into an earlier
          # sibling's descendants. Preserve each complete depth-first branch so
          # no unrelated person can split a spouse-and-descendants block.
          constraint_comment = "      // Keep the next sibling below the preceding sibling's immediate"
          constraint_start = app.index(constraint_comment)
          constraint_end_marker = '        const householdBottom = Math.max(...uniquePrecedingHousehold.map(index => preferredY[index]));'
          constraint_end = app.index(constraint_end_marker, constraint_start)
          constraint_replacement = '''      // Preserve the depth-first reading order: every sibling owns its complete
              // descendant branch, and the next sibling begins only after that block.
              // This also keeps each spouse followed by that union's descendants.
              for (let branchIndex = 1; branchIndex < branches.length; branchIndex += 1) {
                const uniquePrecedingHousehold = branches[branchIndex - 1].indexes;
          '''
          app = app[:constraint_start] + constraint_replacement + app[constraint_end:]
          app_path.write_text(app, encoding='utf-8')

          styles_path = Path('styles.css')
          styles = styles_path.read_text(encoding='utf-8')
          old_gray = '.timeline-decade-band.tone-1 { fill: #e3e3e3; fill-opacity: .78; }'
          new_gray = '.timeline-decade-band.tone-1 { fill: #eeeeee; fill-opacity: .78; }'
          if styles.count(old_gray) != 1:
              raise SystemExit(f'Expected one old gray rule, found {styles.count(old_gray)}')
          styles_path.write_text(styles.replace(old_gray, new_gray), encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          for old, new in [
              ('./styles.css?v=67', './styles.css?v=68'),
              ('./app.js?v=119', './app.js?v=120')
          ]:
              if index.count(old) != 1:
                  raise SystemExit(f'Expected one cache key {old}, found {index.count(old)}')
              index = index.replace(old, new)
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Run unit tests and syntax checks
        run: |
          npm test
          node --check app.js

      - name: Verify household blocks in Chromium
        shell: bash
        run: |
          cat > __household_order_smoke.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <iframe id="app" src="./index.html" style="width:1500px;height:1000px"></iframe>
          <pre id="result">WAIT</pre>
          <script>
          const result = document.getElementById('result');
          const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
          async function waitFor(check, label, attempts = 180) {
            for (let attempt = 0; attempt < attempts; attempt += 1) {
              const value = check();
              if (value) return value;
              await sleep(100);
            }
            throw new Error(`Timed out waiting for ${label}`);
          }
          (async () => {
            try {
              const frame = document.getElementById('app');
              await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
              const doc = frame.contentDocument;
              await waitFor(() => doc.querySelector('.timeline-node'), 'timeline nodes');
              const filter = doc.getElementById('tree-filter');
              filter.value = '';
              filter.dispatchEvent(new Event('input', { bubbles: true }));
              await sleep(1500);

              const ids = {
                margaret: 'profile-g6000000003858820967',
                jamesIV: 'profile-g4229916861440069622',
                archibald: 'profile-g6000000003232538566',
                henryStewart: 'profile-g6000000005412245713',
                henryVIII: 'profile-g6000000007442241030'
              };
              const primaryY = id => {
                const node = doc.querySelector(`.timeline-node[data-node-key="${id}"]`);
                const match = /translate\([^ ,]+[ ,]+([^)]+)\)/.exec(node?.getAttribute('transform') || '');
                return match ? Number(match[1]) : NaN;
              };
              const rows = Object.fromEntries(Object.entries(ids).map(([name, id]) => [name, primaryY(id)]));

              const data = await fetch('./data/british-royal-line.json').then(response => response.json());
              const childrenOfUnion = (firstId, secondId) => Object.values(data.people)
                .filter(person => person.parents?.includes(firstId) && person.parents?.includes(secondId))
                .map(person => person.id);
              const descendantsOf = seeds => {
                const result = new Set();
                const queue = [...seeds];
                while (queue.length) {
                  const id = queue.shift();
                  if (result.has(id) || !data.people[id]) continue;
                  result.add(id);
                  queue.push(...(data.people[id].children || []));
                }
                return result;
              };

              const firstDescendants = descendantsOf(childrenOfUnion(ids.margaret, ids.jamesIV));
              const secondDescendants = descendantsOf(childrenOfUnion(ids.margaret, ids.archibald));
              const novelSecondDescendants = new Set([...secondDescendants].filter(id => !firstDescendants.has(id)));
              const margaretDescendants = descendantsOf(data.people[ids.margaret]?.children || []);
              const firstRows = [...firstDescendants].map(primaryY).filter(Number.isFinite);
              const secondRows = [...novelSecondDescendants].map(primaryY).filter(Number.isFinite);
              const margaretRows = [...margaretDescendants].map(primaryY).filter(Number.isFinite);

              const firstBlock = firstRows.length > 0
                && firstRows.every(y => y > rows.jamesIV && y < rows.archibald);
              const secondBlock = secondRows.length === 0
                || secondRows.every(y => y > rows.archibald && y < rows.henryStewart);
              const wholeMargaretBranch = margaretRows.length > 0
                && margaretRows.every(y => y > rows.margaret && y < rows.henryVIII);
              const chronologicalSpouses = rows.margaret < rows.jamesIV
                && rows.jamesIV < rows.archibald
                && rows.archibald < rows.henryStewart
                && rows.henryStewart < rows.henryVIII;

              const gray = doc.querySelector('.timeline-canvas .timeline-decade-band.tone-1');
              const computed = getComputedStyle(gray);
              const lighterGray = computed.fill === 'rgb(238, 238, 238)' && Number(computed.fillOpacity) === 0.78;
              const checks = { firstBlock, secondBlock, wholeMargaretBranch, chronologicalSpouses, lighterGray };
              const passed = Object.values(checks).every(Boolean);
              result.textContent = `${passed ? 'PASS' : 'FAIL'} ${JSON.stringify({
                checks,
                rows,
                firstRange: firstRows.length ? [Math.min(...firstRows), Math.max(...firstRows)] : [],
                secondRange: secondRows.length ? [Math.min(...secondRows), Math.max(...secondRows)] : [],
                margaretRange: margaretRows.length ? [Math.min(...margaretRows), Math.max(...margaretRows)] : [],
                gray: computed.fill,
                opacity: computed.fillOpacity
              })}`;
            } catch (error) {
              result.textContent = `FAIL ${error.stack || error}`;
            }
          })();
          </script>
          HTML

          python3 -m http.server 4173 > /tmp/lineage-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=30000 --dump-dom http://127.0.0.1:4173/__household_order_smoke.html > /tmp/lineage-order-smoke.html
          grep -oE '(PASS|FAIL) [^<]*' /tmp/lineage-order-smoke.html | head -1
          grep -q 'PASS {' /tmp/lineage-order-smoke.html
          rm __household_order_smoke.html

      - name: Commit verified changes
        shell: bash
        run: |
          rm .github/workflows/apply-strict-household-block-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep each spouse with that union's descendant subtree"
          git push origin HEAD:fix/strict-household-block-order
