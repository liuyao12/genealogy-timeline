name: Resolve spouse ancestor Geni IDs
on:
  push:
    branches: [data/henry-vii-descended-spouses]
    paths: [.github/workflows/resolve-spouse-ancestor-geni-ids.yml]
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/henry-vii-descended-spouses
          fetch-depth: 0
      - name: Resolve Wikidata Geni identifiers
        run: python3 .github/scripts/resolve_spouse_ancestor_geni_ids.py
      - name: Commit identifier report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/spouse-ancestor-geni-ids.json
          git commit -m "Resolve Geni IDs for spouse ancestor branches"
          git push origin HEAD:data/henry-vii-descended-spouses
