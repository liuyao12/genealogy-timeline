name: Tree actions and hidden profile preview
on:
  push:
    branches: [ui/tree-action-profile-preview]
    paths:
      - .github/workflows/tree-action-profile-preview.yml
      - .github/scripts/check_tree_action_ui.mjs
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/tree-action-profile-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply tree-action UI changes
        run: python3 .github/scripts/implement_tree_action_ui.py
      - name: Run automated tests and syntax checks
        run: |
          npm test
          node --check app.js
          node --check .github/scripts/check_tree_action_ui.mjs
          git diff --check
      - name: Start the patched app
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          echo $! >/tmp/lineage-http.pid
          for attempt in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
      - name: Run headless interaction regression
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 --user-data-dir=/tmp/lineage-tree-action-chrome about:blank \
            >/tmp/lineage-chrome.log 2>&1 &
          echo $! >/tmp/lineage-chrome.pid
          node .github/scripts/check_tree_action_ui.mjs http://127.0.0.1:4173/ 9222
      - name: Commit verified implementation
        run: |
          rm .github/scripts/implement_tree_action_ui.py
          rm .github/scripts/check_tree_action_ui.mjs
          rm .github/workflows/tree-action-profile-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use tree actions and preview hidden search results"
          git push origin HEAD:ui/tree-action-profile-preview
