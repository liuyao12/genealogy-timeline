name: Apply white and gray decade bands

on:
  push:
    branches:
      - feature/white-gray-decade-bands

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/white-gray-decade-bands
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Replace the green decade with neutral gray
        run: |
          python3 - <<'PY'
          from pathlib import Path

          styles_path = Path('styles.css')
          styles = styles_path.read_text(encoding='utf-8')
          old = ".timeline-decade-band.tone-1 { fill: #dfe9dc; fill-opacity: .78; }"
          new = ".timeline-decade-band.tone-1 { fill: #e3e3e3; fill-opacity: .78; }"
          if styles.count(old) != 1:
              raise SystemExit(f'Expected exactly one current green decade rule, found {styles.count(old)}')
          styles_path.write_text(styles.replace(old, new), encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_cache = './styles.css?v=66'
          new_cache = './styles.css?v=67'
          if index.count(old_cache) != 1:
              raise SystemExit(f'Expected exactly one stylesheet cache key, found {index.count(old_cache)}')
          index_path.write_text(index.replace(old_cache, new_cache), encoding='utf-8')
          PY

      - name: Run tests
        run: npm test

      - name: Verify the neutral palette
        run: |
          grep -Fq '.timeline-decade-band.tone-0 { fill: #ffffff; fill-opacity: .92; }' styles.css
          grep -Fq '.timeline-decade-band.tone-1 { fill: #e3e3e3; fill-opacity: .78; }' styles.css
          ! grep -Fq '#dfe9dc' styles.css
          grep -Fq './styles.css?v=67' index.html

      - name: Commit verified palette
        run: |
          rm .github/workflows/apply-white-gray-decade-bands.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use white and light gray for decade bands"
          git push origin HEAD:feature/white-gray-decade-bands
