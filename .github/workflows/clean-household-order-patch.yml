name: Clean household-order patch formatting

on:
  push:
    branches:
      - fix/strict-household-block-order

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strict-household-block-order
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          source = path.read_text(encoding='utf-8')
          old = '''      // Preserve the depth-first reading order: every sibling owns its complete
              // descendant branch, and the next sibling begins only after that block.
              // This also keeps each spouse followed by that union's descendants.
              for (let branchIndex = 1; branchIndex < branches.length; branchIndex += 1) {
                const uniquePrecedingHousehold = branches[branchIndex - 1].indexes;
          '''
          new = '''      // Preserve the depth-first reading order: every sibling owns its complete
              // descendant branch, and the next sibling begins only after that block.
              // This also keeps each spouse followed by that union's descendants.
              for (let branchIndex = 1; branchIndex < branches.length; branchIndex += 1) {
                const uniquePrecedingHousehold = branches[branchIndex - 1].indexes;
          '''
          # YAML removes common indentation from the embedded Python string, so
          # construct the actual source fragments explicitly.
          old = (
              "      // Preserve the depth-first reading order: every sibling owns its complete\n"
              "    // descendant branch, and the next sibling begins only after that block.\n"
              "    // This also keeps each spouse followed by that union's descendants.\n"
              "    for (let branchIndex = 1; branchIndex < branches.length; branchIndex += 1) {\n"
              "      const uniquePrecedingHousehold = branches[branchIndex - 1].indexes;\n"
          )
          new = (
              "      // Preserve the depth-first reading order: every sibling owns its complete\n"
              "      // descendant branch, and the next sibling begins only after that block.\n"
              "      // This also keeps each spouse followed by that union's descendants.\n"
              "      for (let branchIndex = 1; branchIndex < branches.length; branchIndex += 1) {\n"
              "        const uniquePrecedingHousehold = branches[branchIndex - 1].indexes;\n"
          )
          if source.count(old) != 1:
              raise SystemExit(f'Expected one generated indentation block, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          npm test
          node --check app.js

      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/clean-household-order-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean household block ordering comments"
          git push origin HEAD:fix/strict-household-block-order
