name: Verify Henry VII cousin-spouse lines
on:
  push:
    branches: [data/add-henry-vii-cousin-spouse-lines]
    paths:
      - .github/workflows/audit-henry-vii-spouses.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/add-henry-vii-cousin-spouse-lines
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add the cousin-spouse gateway lines
        run: |
          python3 .github/scripts/add_henry_vii_cousin_spouse_lines.py
          python3 .github/scripts/sort_cousin_line_children.py
          python3 .github/scripts/fix_cousin_cache_assertions.py
      - name: Run automated and structural checks
        run: |
          npm test
          node --check app.js
          node --check .github/scripts/check_henry_vii_cousin_spouse_lines.mjs
          python3 -m json.tool data/british-royal-line.json >/dev/null
          git diff --check
      - name: Start the application and Chrome
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          for attempt in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/lineage-cousin-spouses about:blank \
            >/tmp/lineage-chrome.log 2>&1 &
      - name: Verify the visible loops and saved-tree migration
        run: node .github/scripts/check_henry_vii_cousin_spouse_lines.mjs http://127.0.0.1:4173/ 9222
      - name: Commit the verified implementation
        run: |
          rm -f \
            .github/scripts/audit_henry_vii_spouses.py \
            .github/scripts/audit_spouse_wikidata.py \
            .github/scripts/resolve_new_royal_geni_ids.py \
            .github/scripts/probe_geni_family_pages.py \
            .github/scripts/trace_confirmed_spouse_paths.py \
            .github/scripts/inspect_factgrid_augusta.py \
            .github/scripts/search_geni_popular_augusta.py \
            .github/scripts/probe_frederick_geni_tree.py \
            .github/scripts/probe_geni_browser.mjs \
            .github/scripts/add_henry_vii_cousin_spouse_lines.py \
            .github/scripts/sort_cousin_line_children.py \
            .github/scripts/fix_cousin_cache_assertions.py \
            .github/scripts/check_henry_vii_cousin_spouse_lines.mjs \
            .github/workflows/audit-henry-vii-spouses.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Henry VII cousin-spouse gateway lines"
          git push origin HEAD:data/add-henry-vii-cousin-spouse-lines
