name: Verify tightened birth and identity detection
on:
  push:
    branches: [fix/hide-fragile-births-and-dedupe-geni]
    paths: [.github/workflows/verify-tightened-birth-detection.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hide-fragile-births-and-dedupe-geni
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply classification refinements
        run: python3 .github/scripts/tighten_birth_and_identity_detection.py
      - name: Run all tests and syntax checks
        run: |
          npm test
          node --check app.js
          node --check descendant-scope.js
          node --check geni-identity.js
          node --check geni-model.js
          node --check geni-import-core.js
          node --check geni-import.js
          git diff --check
      - name: Smoke-test the rendered application
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          for attempt in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=7000 --dump-dom http://127.0.0.1:4173/ >/tmp/lineage-dom.html
          grep -q 'app.js?v=142' /tmp/lineage-dom.html
          grep -q 'timeline-node' /tmp/lineage-dom.html
      - name: Commit the verified refinement
        run: |
          rm .github/scripts/tighten_birth_and_identity_detection.py
          rm .github/workflows/verify-tightened-birth-detection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tighten non-marital birth detection"
          git push origin HEAD:fix/hide-fragile-births-and-dedupe-geni
