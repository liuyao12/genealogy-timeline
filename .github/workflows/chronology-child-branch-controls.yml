name: Verify chronology child branch controls
on:
  push:
    branches: [fix/chronology-child-branch-controls]
    paths:
      - .github/scripts/clarify_chronology_branch_controls.py
      - .github/scripts/refine_chronology_branch_circle.py
      - .github/scripts/check_chronology_branch_controls.mjs
      - .github/workflows/chronology-child-branch-controls.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chronology-child-branch-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move child controls into the side-panel chronology
        run: |
          python3 .github/scripts/clarify_chronology_branch_controls.py
          python3 .github/scripts/refine_chronology_branch_circle.py
      - name: Run unit, syntax, JSON, and whitespace checks
        run: |
          set +e
          npm test >/tmp/chronology-tests.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/chronology-tests.log
          if [ "$STATUS" -ne 0 ]; then
            awk '/^not ok /{capture=1} capture{print} capture && /^  \.\.\./{capture=0; print ""}' /tmp/chronology-tests.log > .github/chronology-test-failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/chronology-test-failure.txt
            git commit -m "Record chronology test failure [skip ci]"
            git push origin HEAD:fix/chronology-child-branch-controls
            exit "$STATUS"
          fi
          rm -f .github/chronology-test-failure.txt
          node --check app.js
          node --check person-events.js
          node --check .github/scripts/check_chronology_branch_controls.mjs
          python3 -m json.tool data/british-royal-line.json >/dev/null
          git diff --check
      - name: Start the application and Chrome
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          for attempt in $(seq 1 100); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --no-first-run --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/lineage-chronology-branches about:blank \
            >/tmp/lineage-chrome.log 2>&1 &
          CHROME_PID=$!
          for attempt in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:9222/json/list >/dev/null; then
              break
            fi
            if ! kill -0 "$CHROME_PID" 2>/dev/null; then
              cat /tmp/lineage-chrome.log
              exit 1
            fi
            sleep .1
          done
          curl -fsS http://127.0.0.1:9222/json/list >/dev/null || {
            cat /tmp/lineage-chrome.log
            exit 1
          }
      - name: Verify branch hiding through the vertical chronology
        run: node .github/scripts/check_chronology_branch_controls.mjs http://127.0.0.1:4173/ 9222
      - name: Commit the verified implementation
        run: |
          rm -f \
            .github/chronology-test-failure.txt \
            .github/scripts/clarify_chronology_branch_controls.py \
            .github/scripts/refine_chronology_branch_circle.py \
            .github/scripts/check_chronology_branch_controls.mjs \
            .github/workflows/chronology-child-branch-controls.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Move child branch controls into the profile chronology [skip ci]"
          git push origin HEAD:fix/chronology-child-branch-controls
