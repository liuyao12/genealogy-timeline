name: Audit Henry VII spouse lines
on:
  push:
    branches: [data/add-henry-vii-cousin-spouse-lines]
    paths:
      - .github/workflows/audit-henry-vii-spouses.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      AUDIT_VERSION: "8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/add-henry-vii-cousin-spouse-lines
      - name: Search the exact indexed Geni page for Princess Augusta
        run: python3 .github/scripts/search_geni_popular_augusta.py
