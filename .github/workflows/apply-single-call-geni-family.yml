name: Apply single-call Geni immediate family

on:
  push:
    branches:
      - fix/geni-immediate-family-rate-limit

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/geni-immediate-family-rate-limit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply rate-limit reduction
        run: python3 .github/scripts/apply_single_call_geni_family.py
      - name: Run tests and syntax checks
        run: |
          npm test
          node --check app.js
          node --check geni-import.js
          grep -q 'profile/immediate-family' docs/geni-import.md
          grep -q 'zgW8WYPaAaGlYDbHFDhXfJosKALeFPUPczL7Q4bK' index.html
      - name: Commit verified change
        run: |
          rm -f .github/scripts/apply_single_call_geni_family.py
          rm -f .github/workflows/apply-single-call-geni-family.yml
          rmdir .github/scripts 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use one Geni request for immediate family'
          git push origin HEAD:fix/geni-immediate-family-rate-limit
