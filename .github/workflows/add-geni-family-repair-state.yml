name: Add Geni family repair state
on:
  push:
    branches: [fix/geni-sidepanel-family-refresh]
    paths: [.github/workflows/add-geni-family-repair-state.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/geni-sidepanel-family-refresh
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply saved-family repair UX
        run: python3 .github/scripts/add_geni_family_repair_state.py
      - name: Run tests and syntax checks
        run: |
          npm test
          node --check app.js
          node --check tests/geni-sidepanel-family.test.mjs
      - name: Commit verified repair UX
        run: |
          rm .github/scripts/add_geni_family_repair_state.py
          rm .github/workflows/add-geni-family-repair-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Offer repair for previously unlinked Geni family data"
          git push origin HEAD:fix/geni-sidepanel-family-refresh
