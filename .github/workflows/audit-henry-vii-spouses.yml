name: Audit Henry VII spouse lines
on:
  push:
    branches: [data/add-henry-vii-cousin-spouse-lines]
    paths:
      - .github/workflows/audit-henry-vii-spouses.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      AUDIT_VERSION: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/add-henry-vii-cousin-spouse-lines
      - name: Resolve Geni IDs for the compact cousin lines
        run: python3 .github/scripts/resolve_new_royal_geni_ids.py
      - name: Probe public Geni family pages for unresolved identities
        run: python3 .github/scripts/probe_geni_family_pages.py
