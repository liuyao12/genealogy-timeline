name: Audit royal example name style
on:
  push:
    branches: [audit/royal-example-name-style]
    paths: [.github/workflows/audit-royal-name-style.yml]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/royal-example-name-style
      - name: Show starter-data migration logic
        run: python3 .github/scripts/show_starter_migration.py
