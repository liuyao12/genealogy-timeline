name: "Apply simplified settings toggles"

on:
  push:
    branches:
      - "ui/settings-toggles"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "ui/settings-toggles"
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply settings UI and state changes
        run: python3 .github/scripts/apply_settings_toggles.py

      - name: Run tests and syntax checks
        run: |
          npm test
          node --check app.js

      - name: Verify settings toggles in Chromium
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=30000 --dump-dom \
            http://127.0.0.1:4173/.github/scripts/settings_smoke.html \
            >/tmp/settings-smoke.html
          grep -oE '(PASS|FAIL) [^<]*' /tmp/settings-smoke.html | head -1
          grep -q 'PASS {' /tmp/settings-smoke.html

      - name: Commit verified changes
        run: |
          rm .github/workflows/apply-settings-toggles.yml
          rm -r .github/scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify timeline settings with persistent toggles"
          git push origin HEAD:ui/settings-toggles
