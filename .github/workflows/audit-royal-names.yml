name: Audit bundled royal names
on:
  push:
    branches: [cleanup/royal-names-and-search-tree-action]
    paths: [.github/workflows/audit-royal-names.yml]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/royal-names-and-search-tree-action
      - name: Inspect starter refresh logic
        run: |
          grep -n -C 14 "starterDataVersion" app.js || true
          grep -n -C 10 "starterProfile" app.js || true
          grep -n -C 10 "british-royal-line" app.js || true
      - name: Print name catalogue and likely style mismatches
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          data = json.loads(Path('data/british-royal-line.json').read_text())
          people = list(data['people'].values())
          people.sort(key=lambda p: (int(p.get('birthYear') or 99999), p.get('displayName','')))
          print('COUNT', len(people), 'VERSION', data.get('version'))
          print('\nALL DISPLAY NAMES')
          for p in people:
              default = next((n.get('name') for n in p.get('namePeriods', []) if n.get('id') == p.get('defaultNamePeriodId')), '')
              print(f"{p.get('birthYear','?'):>5} | {p['id']} | {p.get('displayName','')} | title={p.get('title','')} | default={default}")

          print('\nLIKELY STYLE CANDIDATES')
          rank_words = r'(King|Queen|Prince|Princess|Duke|Duchess|Marquess|Marchioness|Earl|Countess|Baron|Baroness|Viscount|Viscountess|Elector|Electress|Emperor|Empress|Landgrave|Archduke|Archduchess)'
          for p in people:
              name = p.get('displayName','')
              title = p.get('title','')
              reasons = []
              if re.search(r'\bof\s+[A-Z]', name) and ',' not in name and re.search(rank_words, title):
                  reasons.append('territorial-form-with-titled-record')
              if title and title not in name:
                  reasons.append('title-not-in-display-name')
              default = next((n.get('name') for n in p.get('namePeriods', []) if n.get('id') == p.get('defaultNamePeriodId')), '')
              if default and default != name:
                  reasons.append('display-default-mismatch')
              if reasons:
                  print(f"{p.get('birthYear','?'):>5} | {p['id']} | {name} | title={title} | default={default} | {','.join(reasons)}")
          PY
