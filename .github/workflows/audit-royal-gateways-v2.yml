name: Audit royal and consort gateway lines
on:
  push:
    branches: [feature/chronology-royal-lines-v2]
    paths: [.github/workflows/audit-royal-gateways-v2.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chronology-royal-lines-v2
          fetch-depth: 0
      - name: Catalogue royal gateways and incomplete consort lines
        run: |
          python3 - <<'PY'
          import json, re
          from collections import deque
          from pathlib import Path

          data = json.loads(Path('data/british-royal-line.json').read_text())
          people = data['people']
          root = data['rootId']
          names = {pid: p.get('displayName', pid) for pid, p in people.items()}

          def refs(p, field):
              return [x for x in p.get(field, []) if x in people]

          def path_from_root(target):
              q = deque([root]); prev = {root: None}
              while q:
                  current = q.popleft()
                  if current == target: break
                  for child in refs(people[current], 'children'):
                      if child not in prev:
                          prev[child] = current; q.append(child)
              if target not in prev: return []
              out=[]; cur=target
              while cur is not None:
                  out.append(cur); cur=prev[cur]
              return out[::-1]

          def text(p):
              return ' | '.join([
                  str(p.get('displayName','')), str(p.get('title','')), str(p.get('note','')),
                  *[str(x.get('name','')) for x in p.get('namePeriods', [])]
              ])

          lines=[]
          lines.append(f"STARTER version={data.get('version')} profiles={len(people)} root={names.get(root)}")
          lines.append('')
          lines.append('FREDERICK / PRUSSIA / SOPHIA DOROTHEA RECORDS')
          for pid,p in sorted(people.items(), key=lambda kv:(int(kv[1].get('birthYear') or 99999), names[kv[0]])):
              if re.search(r'Frederick|Prussia|Sophia Dorothea', text(p), re.I):
                  lines.append(f"{pid} | {names[pid]} | {p.get('birthYear','?')}-{p.get('deathYear','?')}")
                  lines.append('  parents : ' + ', '.join(names[x] for x in refs(p,'parents')))
                  lines.append('  spouses : ' + ', '.join(names[x] for x in refs(p,'spouses')))
                  lines.append('  children: ' + ', '.join(names[x] for x in refs(p,'children')))
                  path = path_from_root(pid)
                  lines.append('  Henry VII path: ' + (' -> '.join(names[x] for x in path) if path else '(not lineal)'))
          lines.append('')
          lines.append('QUEEN / EMPRESS CONSORT GATEWAYS')
          for pid,p in sorted(people.items(), key=lambda kv:(int(kv[1].get('birthYear') or 99999), names[kv[0]])):
              royal_text = text(p)
              if not re.search(r'\b(queen|empress)\b', royal_text, re.I):
                  continue
              # Ignore sovereign women only when no consort/wife language is present and they have no sovereign spouse.
              spouse_ids = refs(p,'spouses')
              spouse_titles = ' '.join(text(people[x]) for x in spouse_ids)
              is_gateway = bool(re.search(r'consort|wife of|queen of|empress of', royal_text, re.I) or re.search(r'\b(king|emperor|elector|grand duke)\b', spouse_titles, re.I))
              if not is_gateway: continue
              lines.append(f"{pid} | {names[pid]} | title={p.get('title','')} | parents={len(refs(p,'parents'))} children={len(refs(p,'children'))}")
              lines.append('  parents : ' + ', '.join(names[x] for x in refs(p,'parents')))
              lines.append('  spouses : ' + ', '.join(names[x] for x in spouse_ids))
              lines.append('  children: ' + ', '.join(names[x] for x in refs(p,'children')))
              path = path_from_root(pid)
              lines.append('  Henry VII path: ' + (' -> '.join(names[x] for x in path) if path else '(not lineal)'))
          lines.append('')
          lines.append('ROYAL PROFILES WITH NO CHILDREN OR INCOMPLETE PARENTAGE')
          for pid,p in sorted(people.items(), key=lambda kv:(int(kv[1].get('birthYear') or 99999), names[kv[0]])):
              if not re.search(r'\b(king|queen|emperor|empress|elector|electress|grand duke|grand duchess|prince of orange)\b', text(p), re.I):
                  continue
              parent_count=len(refs(p,'parents')); child_count=len(refs(p,'children'))
              if parent_count < 2 or child_count == 0:
                  lines.append(f"{pid} | {names[pid]} | parents={parent_count} children={child_count} spouses={', '.join(names[x] for x in refs(p,'spouses'))}")
          lines.append('')
          lines.append('ALL NON-BRITISH REIGN EVENTS')
          for pid,p in sorted(people.items(), key=lambda kv:(int(kv[1].get('birthYear') or 99999), names[kv[0]])):
              for event in p.get('personalEvents',[]):
                  if event.get('kind') == 'monarch-reign' and event.get('monarchGroup') == 'other':
                      lines.append(f"{names[pid]} | {event.get('startYear')}-{event.get('endYear')}")

          report='\n'.join(lines)+'\n'
          Path('.github/royal-gateway-audit-v2.txt').write_text(report)
          print(report)
          PY
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/royal-gateway-audit-v2.txt
          git commit -m "Record royal gateway audit [skip ci]"
          git push origin HEAD:feature/chronology-royal-lines-v2
