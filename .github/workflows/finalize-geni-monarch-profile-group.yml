name: Finalize Geni monarch profile classification

on:
  push:
    branches: [fix/side-panel-complete-immediate-family]
    paths:
      - .github/workflows/finalize-geni-monarch-profile-group.yml
      - .github/scripts/apply_geni_monarch_profile_group.py

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/side-panel-complete-immediate-family
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply final Geni monarch integration
        run: python3 .github/scripts/apply_geni_monarch_profile_group.py

      - name: Run tests and syntax checks
        run: |
          npm test
          node --check app.js
          node --check monarch-events.js
          git diff --check

      - name: Commit verified implementation
        run: |
          rm -f .github/scripts/apply_geni_monarch_profile_group.py
          rm -f .github/workflows/finalize-geni-monarch-profile-group.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Classify imported Geni reigns by monarch profile"
          git push origin HEAD:fix/side-panel-complete-immediate-family
