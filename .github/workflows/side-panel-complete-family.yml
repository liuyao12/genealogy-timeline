name: Complete immediate family in side panel

on:
  push:
    branches: [fix/side-panel-complete-immediate-family]
    paths:
      - .github/workflows/side-panel-complete-family.yml
      - .github/scripts/apply_side_panel_complete_family.py
      - .github/scripts/check_side_panel_complete_family.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/side-panel-complete-immediate-family
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply side-panel fix
        run: python3 .github/scripts/apply_side_panel_complete_family.py

      - name: Run unit tests and syntax checks
        run: |
          npm test
          node --check app.js
          git diff --check

      - name: Start application and headless Chrome
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          for attempt in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/lineage-side-panel about:blank \
            >/tmp/lineage-chrome.log 2>&1 &

      - name: Verify complete family without refocusing
        run: node .github/scripts/check_side_panel_complete_family.mjs http://127.0.0.1:4173/ 9222

      - name: Commit verified implementation
        run: |
          rm -f .github/scripts/apply_side_panel_complete_family.py
          rm -f .github/scripts/check_side_panel_complete_family.mjs
          rm -f .github/workflows/side-panel-complete-family.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show complete immediate family in side panel"
          git push origin HEAD:fix/side-panel-complete-immediate-family
