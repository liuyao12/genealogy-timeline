name: Audit existing royal lines
on:
  push:
    branches: [feature/chronology-royal-audit]
    paths: [.github/workflows/audit-existing-royal-lines.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chronology-royal-audit
          fetch-depth: 0
      - name: Generate royal-line audit
        run: |
          python3 - <<'PY'
          import json,re
          from collections import defaultdict, deque
          from pathlib import Path

          data=json.loads(Path('data/british-royal-line.json').read_text())
          people=data['people']
          def name(i): return people.get(i,{}).get('displayName',i)
          def alltext(p):
              return ' | '.join([str(p.get(k,'')) for k in ('displayName','title','note')] + [str(x.get('name','')) for x in p.get('namePeriods',[])])
          def rel(i,key): return [name(x) for x in people[i].get(key,[]) if x in people]
          out=[]
          out.append(f"VERSION {data.get('version')} PROFILES {len(people)}")
          out.append('\nQUEEN / EMPRESS / ELECTRESS GATEWAYS')
          royal_re=re.compile(r'\b(?:queen(?: consort| dowager| mother)?|empress|electress|princess of wales)\b',re.I)
          for i,p in sorted(people.items(),key=lambda kv:(int(kv[1].get('birthYear') or 99999),kv[1].get('displayName',''))):
              if not royal_re.search(alltext(p)): continue
              out.append(f"\n{i} | {p.get('displayName')} | {p.get('birthYear')}-{p.get('deathYear')} | title={p.get('title','')}")
              out.append(f"  parents({len(p.get('parents',[]))}): {rel(i,'parents')}")
              out.append(f"  spouses({len(p.get('spouses',[]))}): {rel(i,'spouses')}")
              out.append(f"  children({len(p.get('children',[]))}): {rel(i,'children')}")

          out.append('\n\nMONARCHS WITH INCOMPLETE IMMEDIATE FAMILY')
          mon_re=re.compile(r'\b(?:king|queen|emperor|empress|elector)\b',re.I)
          for i,p in sorted(people.items(),key=lambda kv:(int(kv[1].get('birthYear') or 99999),kv[1].get('displayName',''))):
              if not mon_re.search(alltext(p)): continue
              missing=[]
              if len(p.get('parents',[]))<2: missing.append(f"parents={len(p.get('parents',[]))}")
              if not p.get('spouses'): missing.append('no spouse')
              if not p.get('children'): missing.append('no children')
              if missing:
                  out.append(f"{i} | {p.get('displayName')} | {', '.join(missing)}")

          out.append('\n\nPRUSSIA / BRANDENBURG / FREDERICK RECORDS')
          for i,p in sorted(people.items(),key=lambda kv:(int(kv[1].get('birthYear') or 99999),kv[1].get('displayName',''))):
              if re.search(r'Prussia|Brandenburg|Frederick|Friedrich',alltext(p),re.I):
                  out.append(f"\n{i} | {p.get('displayName')} | {p.get('birthYear')}-{p.get('deathYear')}")
                  out.append(f"  parents: {rel(i,'parents')}")
                  out.append(f"  spouses: {rel(i,'spouses')}")
                  out.append(f"  children: {rel(i,'children')}")

          # Connected components among royal-title profiles and their spouses/parents/children.
          royal_ids={i for i,p in people.items() if mon_re.search(alltext(p)) or royal_re.search(alltext(p))}
          expanded=set(royal_ids)
          for i in list(royal_ids):
              p=people[i]
              expanded.update(x for k in ('parents','spouses','children') for x in p.get(k,[]) if x in people)
          seen=set(); comps=[]
          for start in expanded:
              if start in seen: continue
              q=[start]; seen.add(start); comp=[]
              while q:
                  i=q.pop(); comp.append(i)
                  p=people[i]
                  for j in [x for k in ('parents','children','spouses') for x in p.get(k,[]) if x in expanded]:
                      if j not in seen: seen.add(j); q.append(j)
              comps.append(comp)
          out.append('\n\nROYAL-ADJACENT COMPONENTS')
          for n,comp in enumerate(sorted(comps,key=len,reverse=True),1):
              if len(comp)<2: continue
              out.append(f"\nComponent {n}: {len(comp)} profiles")
              out.extend('  '+name(i) for i in sorted(comp,key=lambda i:(int(people[i].get('birthYear') or 99999),name(i))))

          Path('.github/royal-audit.txt').write_text('\n'.join(out)+'\n')
          PY
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/royal-audit.txt
          git commit -m "Record existing royal-line audit [skip ci]"
          git push origin HEAD:feature/chronology-royal-audit
