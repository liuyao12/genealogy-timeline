name: Implement focus-tree transitions
on:
  push:
    branches: [feature/focus-tree-transition]
    paths: [.github/workflows/implement-focus-tree.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/focus-tree-transition
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focus-tree UI and animation changes
        run: python3 .github/scripts/implement_focus_tree.py
      - name: Run unit tests and syntax checks
        run: |
          npm test
          node --check app.js
          node --check descendant-scope.js
          node --check tests/focus-tree-ui.test.mjs
      - name: Start local app
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          echo $! >/tmp/lineage-http.pid
      - name: Find Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Exercise spouse focus transition in Chromium
        run: node .github/scripts/check_focus_tree_transition.mjs
      - name: Commit verified implementation
        run: |
          rm .github/scripts/implement_focus_tree.py
          rm .github/scripts/check_focus_tree_transition.mjs
          rm .github/workflows/implement-focus-tree.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add smooth spouse focus-tree transitions"
          git push origin HEAD:feature/focus-tree-transition
