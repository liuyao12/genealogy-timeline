name: British royal compaction diagnostic
on:
  push:
    branches: [fix/british-royal-compaction]
  workflow_dispatch:
concurrency:
  group: british-royal-compaction
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Prepare repair variants
        run: |
          git worktree add --detach /tmp/layout-pairwise-runs HEAD
          git worktree add --detach /tmp/layout-singleton-runs HEAD
          git worktree add --detach /tmp/layout-source-first HEAD
          git worktree add --detach /tmp/layout-adaptive HEAD
          python3 - <<'PY'
          from pathlib import Path

          pairwise_path = Path('/tmp/layout-pairwise-runs/app.js')
          pairwise = pairwise_path.read_text()
          old_line = 'if (previousIndex != null && timelineNodesAreImmediateFamily(nodes[previousIndex], nodes[index])) currentRun.push(index);'
          new_line = 'if (previousIndex != null && currentRun.every(runIndex => timelineNodesAreImmediateFamily(nodes[runIndex], nodes[index]))) currentRun.push(index);'
          if pairwise.count(old_line) != 1:
              raise SystemExit(f'Expected one direct-run condition, found {pairwise.count(old_line)}')
          pairwise_path.write_text(pairwise.replace(old_line, new_line, 1))

          singleton_path = Path('/tmp/layout-singleton-runs/app.js')
          singleton = singleton_path.read_text()
          old_line = '    runs: directRuns,'
          new_line = '    runs: nodes.map((_, index) => [index]),'
          if singleton.count(old_line) != 1:
              raise SystemExit(f'Expected one lower-first run argument, found {singleton.count(old_line)}')
          singleton_path.write_text(singleton.replace(old_line, new_line, 1))

          helper_addition = r'''

export function sourceFirstRunOrder(runs = [], precedencePairs = []) {
  const runByNode = runIndexByNode(runs);
  const predecessorsByRun = new Map(runs.map((_, runIndex) => [runIndex, new Set()]));
  precedencePairs.forEach(({ upper, lower }) => {
    const upperRun = runByNode.get(upper);
    const lowerRun = runByNode.get(lower);
    if (upperRun == null || lowerRun == null || upperRun === lowerRun) return;
    predecessorsByRun.get(lowerRun).add(upperRun);
  });
  const pending = runs.map((_, runIndex) => runIndex);
  const result = [];
  const finished = new Set();
  while (pending.length) {
    let position = pending.findIndex(runIndex =>
      [...predecessorsByRun.get(runIndex)].every(predecessor => finished.has(predecessor))
    );
    if (position < 0) position = 0;
    const [runIndex] = pending.splice(position, 1);
    result.push(runIndex);
    finished.add(runIndex);
  }
  return result;
}

export function packTimelineRunsSourceFirst({
  nodes = [], runs = [], precedencePairs = [], rowStep = 0,
  conflicts = () => false, separation = () => rowStep
} = {}) {
  if (!nodes.length || !runs.length) return [];
  const runByNode = runIndexByNode(runs);
  const predecessorsByNode = new Map(nodes.map((_, index) => [index, []]));
  precedencePairs.forEach(pair => {
    if (!predecessorsByNode.has(pair.upper) || !predecessorsByNode.has(pair.lower)) return;
    predecessorsByNode.get(pair.lower).push({
      index: pair.upper,
      gap: Number.isFinite(pair.gap) ? pair.gap : rowStep
    });
  });
  const runOrder = sourceFirstRunOrder(runs, precedencePairs);
  const placed = [];
  const placedSet = new Set();
  runOrder.forEach(runIndex => {
    const run = runs[runIndex].filter(index => nodes[index]);
    if (!run.length) return;
    const offsetByIndex = new Map(run.map((index, offset) => [index, offset * rowStep]));
    let targetTop = 0;
    run.forEach(index => {
      const offset = offsetByIndex.get(index);
      (predecessorsByNode.get(index) || []).forEach(({ index: upperIndex, gap }) => {
        if (runByNode.get(upperIndex) === runIndex || !placedSet.has(upperIndex)) return;
        targetTop = Math.max(targetTop, nodes[upperIndex].y + gap - offset);
      });
    });
    while (true) {
      let nextTop = targetTop;
      for (const index of run) {
        const offset = offsetByIndex.get(index);
        const targetY = targetTop + offset;
        for (const other of placed) {
          if (!conflicts(index, other)) continue;
          const gap = Math.max(0, Number(separation(index, other)) || 0);
          if (Math.abs(targetY - nodes[other].y) + 1e-9 >= gap) continue;
          nextTop = Math.max(nextTop, nodes[other].y + gap - offset);
        }
      }
      if (nextTop <= targetTop + 1e-9) break;
      targetTop = nextTop;
    }
    run.forEach(index => {
      nodes[index].y = rounded(targetTop + offsetByIndex.get(index));
      placed.push(index);
      placedSet.add(index);
    });
  });
  const minimumY = Math.min(...nodes.map(node => node.y));
  nodes.forEach(node => { node.y = rounded(node.y - minimumY); });
  return runOrder;
}

export function packTimelineRunsAdaptive(options = {}) {
  const nodes = options.nodes || [];
  if (!nodes.length) return 'none';
  const originalY = nodes.map(node => node.y);
  const cloneNodes = () => nodes.map((node, index) => ({ ...node, y: originalY[index] }));
  const lowerNodes = cloneNodes();
  const sourceNodes = cloneNodes();
  packTimelineRunsLowerFirst({ ...options, nodes: lowerNodes });
  packTimelineRunsSourceFirst({ ...options, nodes: sourceNodes });
  const normalizedOriginal = (() => {
    const minimum = Math.min(...originalY);
    return originalY.map(y => y - minimum);
  })();
  const score = candidate => {
    const ys = candidate.map(node => node.y);
    return {
      span: Math.max(...ys) - Math.min(...ys),
      movement: ys.reduce((sum, y, index) => sum + Math.abs(y - normalizedOriginal[index]), 0)
    };
  };
  const lowerScore = score(lowerNodes);
  const sourceScore = score(sourceNodes);
  const chooseSource = sourceScore.span < lowerScore.span - 1e-9
    || (Math.abs(sourceScore.span - lowerScore.span) <= 1e-9 && sourceScore.movement <= lowerScore.movement);
  const chosen = chooseSource ? sourceNodes : lowerNodes;
  nodes.forEach((node, index) => { node.y = chosen[index].y; });
  return chooseSource ? 'source-first' : 'lower-first';
}
'''

          for directory, packer in [
              ('/tmp/layout-source-first', 'packTimelineRunsSourceFirst'),
              ('/tmp/layout-adaptive', 'packTimelineRunsAdaptive')
          ]:
              helper_path = Path(directory) / 'timeline-compaction.js'
              helper_path.write_text(helper_path.read_text() + helper_addition)
              app_path = Path(directory) / 'app.js'
              app = app_path.read_text()
              old_import = 'import { birthOrderPairs, packTimelineRunsLowerFirst } from \'./timeline-compaction.js?v=2\';'
              new_import = f'import {{ birthOrderPairs, {packer} }} from \'./timeline-compaction.js?v=2\';'
              if app.count(old_import) != 1:
                  raise SystemExit(f'Expected one compaction import in {directory}, found {app.count(old_import)}')
              app = app.replace(old_import, new_import, 1)
              if app.count('packTimelineRunsLowerFirst({') != 1:
                  raise SystemExit(f'Expected one lower-first call in {directory}')
              app_path.write_text(app.replace('packTimelineRunsLowerFirst({', f'{packer}({{', 1))
          PY
      - name: Measure current and repair variants
        run: |
          set -euo pipefail
          measure() {
            local directory="$1" port="$2" label="$3"
            (cd "$directory" && python3 -m http.server "$port" >/tmp/royal-$label-http.log 2>&1 & echo $! >/tmp/royal-$label.pid)
            for attempt in $(seq 1 50); do
              curl -fsS "http://127.0.0.1:$port/" >/dev/null && break
              sleep .1
            done
            timeout 35s node .github/scripts/measure_royal_compaction.mjs "http://127.0.0.1:$port/" "$label"
            kill "$(cat /tmp/royal-$label.pid)" || true
          }
          measure "$GITHUB_WORKSPACE" 4173 current | tee /tmp/current.json
          measure /tmp/layout-pairwise-runs 4174 pairwise-runs | tee /tmp/pairwise-runs.json
          measure /tmp/layout-singleton-runs 4175 singleton-runs | tee /tmp/singleton-runs.json
          measure /tmp/layout-source-first 4176 source-first | tee /tmp/source-first.json
          measure /tmp/layout-adaptive 4177 adaptive | tee /tmp/adaptive.json
      - name: Summarize target positions
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const files = ['/tmp/current.json', '/tmp/pairwise-runs.json', '/tmp/singleton-runs.json', '/tmp/source-first.json', '/tmp/adaptive.json'];
          const rows = files.map(file => JSON.parse(readFileSync(file, 'utf8'))).flatMap(result => [
            { version: result.label, mode: 'king queen', span: result.filtered.verticalSpan, rows: result.filtered.distinctRowCount, HenryVIII: result.filtered.henryVIII?.row, HenryY: result.filtered.henryVIII?.y, CharlesII: result.filtered.charlesII?.row, CharlesY: result.filtered.charlesII?.y },
            { version: result.label, mode: 'all', span: result.unfiltered.verticalSpan, rows: result.unfiltered.distinctRowCount, HenryVIII: result.unfiltered.henryVIII?.row, HenryY: result.unfiltered.henryVIII?.y, CharlesII: result.unfiltered.charlesII?.row, CharlesY: result.unfiltered.charlesII?.y }
          ]);
          console.table(rows);
          EOF
