name: Apply source-order royal compaction
on:
  push:
    branches: [fix/british-royal-compaction]
    paths:
      - .github/workflows/royal-compaction-diagnostic.yml
concurrency:
  group: british-royal-compaction-source-order
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/british-royal-compaction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source-order production patch
        run: |
          python3 .github/scripts/fix_source_first_patch.py
          python3 .github/scripts/implement_source_first_compaction.py
      - name: Run automated tests and syntax checks
        run: |
          npm test
          node --check app.js
          node --check timeline-compaction.js
          node --check tests/timeline-compaction-priority.test.mjs
          git diff --check
      - name: Start patched app
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          echo $! >/tmp/lineage-http.pid
          for attempt in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
      - name: Find Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Verify the British royal line stays near the top
        run: |
          node .github/scripts/measure_royal_compaction.mjs http://127.0.0.1:4173/ production | tee /tmp/royal-layout.json
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('/tmp/royal-layout.json', 'utf8'));
          const { filtered, unfiltered } = result;

          assert.equal(filtered.henryVIII.initiallyVisible, true, 'Henry VIII should appear in the opening British royal viewport');
          assert.ok(filtered.henryVIII.y <= 700, `Henry VIII is too low under the default filter: ${filtered.henryVIII.y}`);
          assert.ok(filtered.charlesII.y <= 1050, `Charles II is too low under the default filter: ${filtered.charlesII.y}`);
          assert.ok(filtered.charlesII.y - filtered.henryVIII.y <= 450, 'Henry VIII and Charles II should remain in one nearby royal cluster');
          assert.ok(filtered.verticalSpan <= 1900, `The filtered royal line is too tall: ${filtered.verticalSpan}`);
          assert.ok(unfiltered.henryVIII.y <= 800, `Henry VIII is too low without a filter: ${unfiltered.henryVIII.y}`);
          assert.ok(unfiltered.charlesII.y <= 1050, `Charles II is too low without a filter: ${unfiltered.charlesII.y}`);
          assert.ok(filtered.henryVIII.nearby.length >= 7, 'Henry VIII should retain a useful group of neighboring nodes');
          assert.ok(filtered.charlesII.nearby.length >= 8, 'Charles II should retain a useful group of neighboring nodes');

          console.table([
            { mode: 'king queen', span: filtered.verticalSpan, HenryVIII: filtered.henryVIII.y, CharlesII: filtered.charlesII.y },
            { mode: 'all people', span: unfiltered.verticalSpan, HenryVIII: unfiltered.henryVIII.y, CharlesII: unfiltered.charlesII.y }
          ]);
          EOF
      - name: Commit verified implementation
        run: |
          rm -f .github/scripts/measure_royal_compaction.mjs
          rm -f .github/scripts/make_compaction_variants.py
          rm -f .github/scripts/implement_source_first_compaction.py
          rm -f .github/scripts/fix_source_first_patch.py
          rm -f .github/workflows/royal-compaction-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore source-order timeline compaction"
          git push origin HEAD:fix/british-royal-compaction
