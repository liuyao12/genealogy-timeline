name: Implement lower-first timeline compaction
on:
  push:
    branches: [feature/lower-first-compaction]
    paths: [.github/workflows/lower-first-compaction.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lower-first-compaction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply lower-first compaction
        run: python3 .github/scripts/implement_lower_first_compaction.py
      - name: Run tests and syntax checks
        run: |
          npm test
          node --check app.js
          node --check timeline-compaction.js
          node --check tests/timeline-compaction-priority.test.mjs
          git diff --check
      - name: Start local app
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          echo $! >/tmp/lineage-http.pid
      - name: Find Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Smoke-test the deployed layout code in Chrome
        run: node .github/scripts/check_lower_first_compaction.mjs
      - name: Commit verified implementation
        run: |
          rm .github/scripts/implement_lower_first_compaction.py
          rm .github/scripts/check_lower_first_compaction.mjs
          rm .github/workflows/lower-first-compaction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prioritize lower branches during timeline compaction"
          git push origin HEAD:feature/lower-first-compaction
