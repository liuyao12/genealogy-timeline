name: Apply Geni generation graph refactor
on:
  push:
    branches: [refactor/geni-generation-graph]
    paths: [.github/workflows/apply-geni-graph-refactor.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/geni-generation-graph
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cache, field, and documentation changes
        run: python3 .github/scripts/apply_geni_graph_refactor.py
      - name: Run tests and syntax checks
        run: |
          npm test
          node --check geni-config.js
          node --check geni-model.js
          node --check geni-api.js
          node --check geni-import-core.js
          node --check geni-import.js
          node --check app.js
          ! grep -R "Ks7E8mCtICOvVRpmvreTwOZdb4uMIiKNqRmF81II" index.html docs/geni-import.md
          ! grep -E "birth_date|death_date|marriage_date|location|month|day" geni-config.js
      - name: Commit verified refactor
        run: |
          rm .github/scripts/apply_geni_graph_refactor.py
          rm .github/workflows/apply-geni-graph-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Batch Geni descendants by generation graph"
          git push origin HEAD:refactor/geni-generation-graph
