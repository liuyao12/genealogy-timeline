name: Verify hidden branches and Geni identity v3
on:
  push:
    branches: [feature/hide-noisy-births-and-dedupe-geni]
    paths: [.github/workflows/verify-noisy-births-geni-identity-v3.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hide-noisy-births-and-dedupe-geni
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply, test, browser-check, and commit
        run: bash .github/scripts/run_noisy_birth_verification_v3.sh
