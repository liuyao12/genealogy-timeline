name: Verify place-based titles and George III family repair
on:
  push:
    branches: [fix/place-based-royal-titles-and-george-family]
    paths:
      - .github/workflows/audit-place-titles-george-family.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/place-based-royal-titles-and-george-family
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply title normalization and relationship repair
        run: |
          python3 .github/scripts/apply_place_titles_george_family.py
          python3 .github/scripts/fix_place_title_test_expectations.py
      - name: Run automated and structural checks
        run: |
          npm test
          node --check app.js
          node --check royal-title-style.js
          node --check .github/scripts/check_place_titles_george_family.mjs
          python3 -m json.tool data/british-royal-line.json >/dev/null
          git diff --check
      - name: Start the application and Chrome
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          for attempt in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/lineage-place-titles about:blank \
            >/tmp/lineage-chrome.log 2>&1 &
      - name: Verify the repaired branches and saved-tree migration
        run: node .github/scripts/check_place_titles_george_family.mjs http://127.0.0.1:4173/ 9222
      - name: Commit the verified implementation
        run: |
          rm -f .github/scripts/audit_place_titles_george_family.py
          rm -f .github/scripts/apply_place_titles_george_family.py
          rm -f .github/scripts/fix_place_title_test_expectations.py
          rm -f .github/scripts/check_place_titles_george_family.mjs
          rm -f .github/workflows/audit-place-titles-george-family.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize British royal place titles and repair George III family"
          git push origin HEAD:fix/place-based-royal-titles-and-george-family
