name: Expand paternal focus households
on:
  push:
    branches: [feature/paternal-households]
    paths: [.github/workflows/expand-paternal-households.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/paternal-households
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply paternal household projection and focus styling
        run: |
          python3 .github/scripts/expand_paternal_households.py
          python3 .github/scripts/fix_paternal_household_expectation.py
      - name: Run unit tests and syntax checks
        run: |
          npm test
          node --check app.js
          node --check descendant-scope.js
          node --check tests/descendant-scope.test.mjs
          node --check tests/focus-tree-ui.test.mjs
      - name: Start local app
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          echo $! >/tmp/lineage-http.pid
      - name: Find Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Exercise paternal households and spouse refocusing
        run: node .github/scripts/check_paternal_households.mjs
      - name: Commit verified implementation
        run: |
          rm .github/scripts/expand_paternal_households.py
          rm .github/scripts/fix_paternal_household_expectation.py
          rm .github/scripts/check_paternal_households.mjs
          rm .github/workflows/expand-paternal-households.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show complete paternal households in focus trees"
          git push origin HEAD:feature/paternal-households
