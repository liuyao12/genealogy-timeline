name: Verify foreign royal gateway expansion
on:
  push:
    branches: [data/expand-foreign-royal-families]
    paths: [.github/workflows/audit-foreign-royal-branches.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/expand-foreign-royal-families
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expand the bundled foreign royal gateway families
        run: |
          python3 .github/scripts/expand_foreign_royal_families.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/royal-name-style.test.mjs')
          text = path.read_text()
          old = 'assert.equal(starter.version, 25);'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one version-25 assertion, found {text.count(old)}')
          path.write_text(text.replace(old, 'assert.equal(starter.version, 26);', 1))
          PY
      - name: Run automated tests and structural checks
        run: |
          npm test
          node --check app.js
          node --check .github/scripts/check_foreign_royal_jumps.mjs
          python3 -m json.tool data/british-royal-line.json >/dev/null
          git diff --check
      - name: Start the expanded example
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          echo $! >/tmp/lineage-http.pid
          for attempt in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
      - name: Verify side-panel jumps into France, Denmark, and Portugal
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 --user-data-dir=/tmp/lineage-foreign-royals about:blank \
            >/tmp/lineage-chrome.log 2>&1 &
          echo $! >/tmp/lineage-chrome.pid
          node .github/scripts/check_foreign_royal_jumps.mjs http://127.0.0.1:4173/ 9222
      - name: Summarize the expanded gateways
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/british-royal-line.json').read_text())
          people = data['people']
          print('VERSION', data['version'], 'PROFILES', len(people))
          for pid in [
              'profile-g6000000000440363134',
              'royal-france-claude-1499',
              'royal-france-henry-ii-1519',
              'profile-g6000000003232545902',
          ]:
              person = people[pid]
              print(pid, '|', person['displayName'], '| children=', [people[x]['displayName'] for x in person['children']])
          PY
      - name: Commit the verified expansion
        run: |
          rm .github/scripts/expand_foreign_royal_families.py
          rm .github/scripts/check_foreign_royal_jumps.mjs
          rm .github/workflows/audit-foreign-royal-branches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand foreign royal gateway families"
          git push origin HEAD:data/expand-foreign-royal-families
