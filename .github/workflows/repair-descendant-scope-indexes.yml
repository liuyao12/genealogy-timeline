name: Repair descendant scope indexes

on:
  push:
    branches:
      - feature/single-descendant-tree
    paths:
      - .github/workflows/repair-descendant-scope-indexes.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/single-descendant-tree
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply repaired relationship indexes
        run: python scripts/repair_descendant_scope_indexes.py
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: node --check app.js && node --check descendant-scope.js
      - name: Commit repaired application
        run: |
          rm .github/workflows/repair-descendant-scope-indexes.yml
          rm scripts/repair_descendant_scope_indexes.py
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use repaired parent-child links in the descendant view"
          git push origin HEAD:feature/single-descendant-tree
