name: Verify single descendant tree

on:
  push:
    branches:
      - feature/single-descendant-tree
    paths:
      - .github/workflows/verify-single-descendant-tree.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/single-descendant-tree
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: node --check app.js && node --check descendant-scope.js
      - name: Remove temporary verifier
        run: |
          rm .github/workflows/verify-single-descendant-tree.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary descendant-tree verifier"
          git push origin HEAD:feature/single-descendant-tree
