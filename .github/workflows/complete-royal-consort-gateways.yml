name: Complete foreign royal consort gateways
on:
  push:
    branches: [data/complete-royal-consort-gateways]
    paths:
      - .github/scripts/royal_gateway_specs.py
      - .github/scripts/expand_royal_consortroutes.py
      - .github/scripts/fix_royal_expansion_lookup.py
      - .github/scripts/check_royal_gateway_expansion.mjs
      - .github/workflows/complete-royal-consort-gateways.yml
      - tests/royal-consort-gateways.test.mjs
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/complete-royal-consort-gateways
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expand audited royal gateways with verified Geni identities
        run: |
          python3 .github/scripts/fix_royal_expansion_lookup.py
          python3 .github/scripts/expand_royal_consortroutes.py | tee /tmp/royal-expansion.txt
      - name: Run structural and application tests
        run: |
          npm test
          node --check app.js
          node --check person-events.js
          node --check .github/scripts/check_royal_gateway_expansion.mjs
          python3 -m json.tool data/british-royal-line.json >/dev/null
          git diff --check
      - name: Start application and Chrome
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          for attempt in $(seq 1 80); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --no-first-run --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/lineage-royal-gateways about:blank \
            >/tmp/lineage-chrome.log 2>&1 &
          CHROME_PID=$!
          for attempt in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:9222/json/list >/dev/null; then break; fi
            if ! kill -0 "$CHROME_PID" 2>/dev/null; then cat /tmp/lineage-chrome.log; exit 1; fi
            sleep .1
          done
          curl -fsS http://127.0.0.1:9222/json/list >/dev/null || { cat /tmp/lineage-chrome.log; exit 1; }
      - name: Verify gateway trees in Chrome
        run: node .github/scripts/check_royal_gateway_expansion.mjs http://127.0.0.1:4173/ 9222
      - name: Commit verified audited expansion
        run: |
          rm -f \
            .github/scripts/royal_gateway_specs.py \
            .github/scripts/expand_royal_consortroutes.py \
            .github/scripts/fix_royal_expansion_lookup.py \
            .github/scripts/check_royal_gateway_expansion.mjs \
            .github/workflows/complete-royal-consort-gateways.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete foreign royal consort gateways [skip ci]"
          git push origin HEAD:data/complete-royal-consort-gateways
