name: Apply timeline band polish

on:
  push:
    branches: [feature/timeline-band-polish]
    paths: [.github/workflows/apply-timeline-band-polish.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/timeline-band-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped timeline changes
        run: python3 scripts/apply_timeline_band_polish.py
      - name: Run unit tests
        run: npm test
      - name: Check JavaScript syntax
        run: node --check app.js && node --check timeline-bands.js
      - name: Smoke-test alignment, masking, palette, and spouse order
        shell: bash
        run: |
          cat > __timeline_smoke.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <iframe id="app" src="./index.html" style="width:1400px;height:900px"></iframe>
          <pre id="result">WAIT</pre>
          <script>
          const result = document.getElementById('result');
          const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
          async function waitFor(check, label, attempts = 80) {
            for (let attempt = 0; attempt < attempts; attempt += 1) {
              const value = check();
              if (value) return value;
              await sleep(100);
            }
            throw new Error(`Timed out waiting for ${label}`);
          }
          (async () => {
            try {
              const frame = document.getElementById('app');
              await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
              const doc = frame.contentDocument;
              await waitFor(() => doc.querySelector('.timeline-canvas .timeline-decade-band'), 'the timeline');

              const filter = doc.getElementById('tree-filter');
              filter.value = '';
              filter.dispatchEvent(new Event('input', { bubbles: true }));
              await sleep(500);

              const yFor = id => {
                const nodes = [...doc.querySelectorAll(`.timeline-node[data-person-id="${id}"]`)];
                return Math.min(...nodes.map(node => Number(/translate\([^ ,]+[ ,]+([^)]+)\)/.exec(node.getAttribute('transform'))?.[1])));
              };
              const spouseOrder = [
                yFor('profile-g6000000003858820967'),
                yFor('profile-g4229916861440069622'),
                yFor('profile-g6000000003232538566'),
                yFor('profile-g6000000005412245713'),
                yFor('profile-g6000000007442241030')
              ];

              doc.getElementById('timeline-as-of-year').value = '1600';
              doc.getElementById('set-timeline-as-of').click();
              await waitFor(() => doc.querySelector('#timeline-as-of-content-mask'), 'the historical mask');

              const band = doc.querySelector('.timeline-canvas .timeline-decade-band[data-decade="1500"]');
              const tick = doc.querySelector('.timeline-ruler .year-tick[data-year="1500"]');
              const content = doc.querySelector('.timeline-content');
              const maskRects = [...doc.querySelectorAll('#timeline-as-of-content-mask rect')];
              const fill = getComputedStyle(doc.querySelector('.timeline-canvas .timeline-decade-band.tone-0')).fill;
              const checks = {
                bandAlignedToTick: Number(band?.getAttribute('x')) === Number(tick?.getAttribute('x1')),
                warmSagePalette: fill === 'rgb(227, 233, 220)',
                decadeOutsideMask: !band?.closest('.timeline-content'),
                contentUsesMask: content?.getAttribute('mask')?.includes('timeline-as-of-content-mask') === true,
                twoMaskSegments: maskRects.length === 2,
                futureOpacityPreserved: Number(maskRects[1]?.getAttribute('fill-opacity')) === 0.32,
                noWhiteDimOverlay: !doc.querySelector('.timeline-as-of-dim'),
                margaretHouseholdBeforeHenry: spouseOrder.every(Number.isFinite)
                  && spouseOrder.every((value, index) => index === 0 || spouseOrder[index - 1] < value)
              };
              const passed = Object.values(checks).every(Boolean);
              result.textContent = `${passed ? 'PASS' : 'FAIL'} ${JSON.stringify({ checks, spouseOrder, bandX: band?.getAttribute('x'), tickX: tick?.getAttribute('x1'), fill })}`;
            } catch (error) {
              result.textContent = `FAIL ${error.stack || error}`;
            }
          })();
          </script>
          HTML
          python3 -m http.server 4173 > /tmp/lineage-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=16000 --dump-dom http://127.0.0.1:4173/__timeline_smoke.html > /tmp/lineage-smoke.html
          grep -o 'PASS {[^<]*' /tmp/lineage-smoke.html
          grep -q 'PASS {' /tmp/lineage-smoke.html
          rm __timeline_smoke.html
      - name: Commit verified application
        shell: bash
        run: |
          rm .github/workflows/apply-timeline-band-polish.yml
          rm .github/workflows/diagnose-household-order.yml
          rm scripts/apply_timeline_band_polish.py
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish decade bands and historical snapshot dimming"
          git push origin HEAD:feature/timeline-band-polish
