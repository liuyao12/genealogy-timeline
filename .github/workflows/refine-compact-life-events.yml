name: Refine compact life-event chronology
on:
  push:
    branches: [feature/side-panel-life-events]
    paths:
      - .github/scripts/refine_compact_life_events.py
      - .github/scripts/check_compact_life_events.mjs
      - .github/workflows/refine-compact-life-events.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/side-panel-life-events
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align the refinement with the current settings wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/refine_compact_life_events.py')
          text = path.read_text(encoding='utf-8')
          old_source = "'Show or hide all marriage, child-birth, relationship-end, and authored marks together'"
          new_source = "'Show or hide marks for marriages, children’s births, divorces or annulments, and authored events'"
          old_target = "'Show or hide all marriage, child-birth, and authored marks together'"
          new_target = "'Show or hide marks for marriages, children’s births, and authored events'"
          if text.count(old_source) != 1 or text.count(old_target) != 1:
              raise SystemExit('Could not locate the settings-copy replacement in the refinement script.')
          path.write_text(text.replace(old_source, new_source).replace(old_target, new_target), encoding='utf-8')
          PY
      - name: Generate compact life-event chronology
        run: python3 .github/scripts/refine_compact_life_events.py
      - name: Run unit and structural checks
        run: |
          npm test
          node --check app.js
          node --check person-events.js
          node --check .github/scripts/check_compact_life_events.mjs
          python3 -m json.tool data/british-royal-line.json >/dev/null
          git diff --check
      - name: Start the application and Chrome
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          for attempt in $(seq 1 80); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/lineage-compact-life-events about:blank \
            >/tmp/lineage-chrome.log 2>&1 &
      - name: Verify the refined ledger in Chrome
        run: node .github/scripts/check_compact_life_events.mjs http://127.0.0.1:4173/ 9222
      - name: Commit the verified implementation
        run: |
          rm -f \
            .github/scripts/refine_compact_life_events.py \
            .github/scripts/check_compact_life_events.mjs \
            .github/workflows/refine-compact-life-events.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Simplify marriage chronology in life events [skip ci]"
          git push origin HEAD:feature/side-panel-life-events
