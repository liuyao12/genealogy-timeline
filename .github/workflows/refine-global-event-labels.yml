name: Refine global event labels
on:
  push:
    branches: [ui/global-event-labels-centered]
    paths: [.github/workflows/refine-global-event-labels.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/global-event-labels-centered
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Center labels and compact ruler lanes
        run: |
          python3 .github/scripts/refine_global_event_labels.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/timeline-event-labels.test.mjs')
          text = path.read_text()
          old = """  assert.deepEqual(layout.items.map(item => item.lane), [0, 1, 2]);
          assert.deepEqual(layout.items.map(item => item.anchorX), [56, 60, 64]);
          """
          new = """  assert.deepEqual(layout.items.map(item => item.lane), [0, 1, 2]);
          const byName = Object.fromEntries(layout.items.map(item => [item.name, item]));
          assert.equal(byName['Long event one'].anchorX, 56);
          assert.equal(byName['Long event two'].anchorX, 60);
          assert.equal(byName['Long event three'].anchorX, 64);
          """
          if text.count(old) != 1:
              raise SystemExit('Could not update the order-independent midpoint assertion')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run unit tests and syntax checks
        run: |
          npm test
          node --check app.js
          node --check timeline-event-labels.js
          node --check tests/timeline-event-labels.test.mjs
          node --check tests/timeline-ruler-layout.test.mjs
      - name: Start local app
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          echo $! >/tmp/lineage-http.pid
      - name: Find Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Check rendered event-label geometry
        run: node .github/scripts/check_centered_event_labels.mjs
      - name: Commit verified changes
        run: |
          rm .github/scripts/refine_global_event_labels.py
          rm .github/scripts/check_centered_event_labels.mjs
          rm .github/workflows/refine-global-event-labels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Center global event labels over their bands"
          git push origin HEAD:ui/global-event-labels-centered
