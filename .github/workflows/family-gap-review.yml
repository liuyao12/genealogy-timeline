name: Review immediate-family gaps
on:
  push:
    branches: [fix/immediate-family-gaps]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused layout fix
        run: python3 .github/scripts/apply_family_gaps.py
      - name: Tests and syntax checks
        run: |
          npm test
          node --check app.js
          node --check .github/scripts/check_two_line_chronology.mjs
          git diff --check
      - name: Start application and Chrome
        run: |
          mkdir -p /tmp/gap-review
          python3 -m http.server 4173 >/tmp/gap-review/http.log 2>&1 &
          for attempt in $(seq 1 80); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --no-first-run --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/lineage-family-gaps about:blank \
            >/tmp/gap-review/chrome.log 2>&1 &
          CHROME_PID=$!
          for attempt in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:9222/json/list >/dev/null; then break; fi
            if ! kill -0 "$CHROME_PID" 2>/dev/null; then cat /tmp/gap-review/chrome.log; exit 1; fi
            sleep .1
          done
          curl -fsS http://127.0.0.1:9222/json/list >/dev/null
      - name: Check all five node sizes in Chrome
        env:
          LINEAGE_REPORT: /tmp/gap-review/geometry.json
          LINEAGE_SCREENSHOT: /tmp/gap-review/layout.png
        run: node .github/scripts/check_two_line_chronology.mjs http://127.0.0.1:4173/ 9222
      - name: Commit only the verified implementation
        run: |
          rm .github/scripts/apply_family_gaps.py .github/workflows/family-gap-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Restore compact immediate-family gaps and test relationship-aware geometry'
          git push origin HEAD:fix/immediate-family-gaps
      - name: Capture verification artifacts
        if: always()
        run: |
          mkdir -p /tmp/gap-review
          git rev-parse HEAD > /tmp/gap-review/commit.txt
          tar --exclude=.git -czf /tmp/gap-review/source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-gap-verification
          path: /tmp/gap-review/
          retention-days: 7
