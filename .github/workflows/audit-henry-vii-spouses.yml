name: Audit Henry VII spouse lines
on:
  push:
    branches: [data/add-henry-vii-cousin-spouse-lines]
    paths:
      - .github/workflows/audit-henry-vii-spouses.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      AUDIT_VERSION: "5"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/add-henry-vii-cousin-spouse-lines
      - name: Trace confirmed spouse descents to Henry VII
        run: python3 .github/scripts/trace_confirmed_spouse_paths.py
