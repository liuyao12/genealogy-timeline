name: Audit foreign royal gateways
on:
  push:
    branches: [data/expand-foreign-royal-families]
    paths: [.github/workflows/audit-foreign-royal-branches.yml]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/expand-foreign-royal-families
      - name: Catalogue foreign royals and existing paths
        run: |
          python3 - <<'PY'
          import json
          from collections import deque
          from pathlib import Path

          data = json.loads(Path('data/british-royal-line.json').read_text())
          people = data['people']
          names = {pid: p.get('displayName', pid) for pid, p in people.items()}

          def neighbours(pid):
              p = people[pid]
              return [x for key in ('parents','children','spouses','partners') for x in p.get(key, []) if x in people]

          def path(a, b):
              q = deque([a]); prev = {a: None}
              while q:
                  x = q.popleft()
                  if x == b: break
                  for y in neighbours(x):
                      if y not in prev:
                          prev[y] = x; q.append(y)
              if b not in prev: return []
              out=[]; x=b
              while x is not None: out.append(x); x=prev[x]
              return out[::-1]

          countries = ('France','French','Scots','Scotland','Spain','Portugal','Denmark','Greece','Bohemia','Hanover','Hesse','Orange','Palatine','Austria','Leiningen','Teck','Battenberg','Braganza','Modena','Ansbach','Brunswick','Saxe','Mecklenburg')
          print('VERSION', data.get('version'), 'COUNT', len(people))
          print('\nFOREIGN / CONTINENTAL ROYAL GATEWAYS')
          for pid, p in sorted(people.items(), key=lambda kv: (int(kv[1].get('birthYear') or 99999), kv[1].get('displayName',''))):
              text = ' '.join(str(p.get(k,'')) for k in ('displayName','title','note'))
              if any(c.lower() in text.lower() for c in countries):
                  rel = lambda key: [names.get(x,x) for x in p.get(key,[]) if x in people]
                  print('\n', pid, '|', p.get('displayName'), '|', p.get('birthYear'), '-', p.get('deathYear'), '| title=',p.get('title'))
                  print('  parents :', rel('parents'))
                  print('  spouses :', rel('spouses'))
                  print('  children:', rel('children'))

          louis = next(pid for pid,p in people.items() if p.get('displayName') == 'Louis XII, King of France')
          francis = next(pid for pid,p in people.items() if p.get('displayName') == 'Francis II, King of France')
          print('\nCURRENT LOUIS XII -> FRANCIS II GRAPH PATH')
          for pid in path(louis, francis): print(' ', pid, names[pid])
          PY
