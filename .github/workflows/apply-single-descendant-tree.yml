name: Apply single descendant tree patch

on:
  push:
    branches:
      - feature/single-descendant-tree
    paths:
      - .github/workflows/apply-single-descendant-tree.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/single-descendant-tree
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped descendant-tree patch
        run: python scripts/apply_single_descendant_tree.py
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: node --check app.js && node --check descendant-scope.js
      - name: Commit patched application
        run: |
          rm .github/workflows/apply-single-descendant-tree.yml
          rm scripts/apply_single_descendant_tree.py
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restrict the timeline to one descendant tree"
          git push origin HEAD:feature/single-descendant-tree
