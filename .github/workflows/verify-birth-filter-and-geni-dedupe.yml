# Retry 2: target only the saved-profile relationship migration.
name: Verify birth filtering and Geni identity merging
on:
  push:
    branches: [fix/hide-fragile-births-and-dedupe-geni]
    paths: [.github/workflows/verify-birth-filter-and-geni-dedupe.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hide-fragile-births-and-dedupe-geni
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the production changes
        run: |
          python3 .github/scripts/fix_birth_filter_patch_script.py
          python3 .github/scripts/apply_birth_filter_and_geni_dedupe.py
      - name: Run automated tests and syntax checks
        run: |
          npm test
          node --check app.js
          node --check descendant-scope.js
          node --check geni-identity.js
          node --check geni-model.js
          node --check geni-import-core.js
          node --check geni-import.js
          node --check .github/scripts/check_birth_filter_and_geni_dedupe.mjs
          git diff --check
      - name: Check the real British royal example
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { computeDescendantScope } from './descendant-scope.js';
          const starter = JSON.parse(readFileSync('./data/british-royal-line.json', 'utf8'));
          const scope = computeDescendantScope(starter.people, starter.rootId);
          const ids = new Map(Object.entries(starter.people).map(([id, person]) => [person.displayName, id]));
          for (const name of ['Henry VIII, King of England', 'Charles II, King of England']) {
            assert.ok(scope.allowedIds.has(ids.get(name)), `${name} must remain in Henry VII's tree`);
          }
          const reasons = {};
          for (const reason of scope.suppressionReasons.values()) reasons[reason] = (reasons[reason] || 0) + 1;
          console.log(JSON.stringify({
            stored: Object.keys(starter.people).length,
            visibleScope: scope.allowedIds.size,
            suppressed: scope.suppressedIds.size,
            reasons
          }));
          NODE
      - name: Start the application
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          echo $! >/tmp/lineage-http.pid
          for attempt in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
      - name: Verify filtering, searchability, deduplication, and reconnection in Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 --user-data-dir=/tmp/lineage-birth-dedupe about:blank \
            >/tmp/lineage-chrome.log 2>&1 &
          echo $! >/tmp/lineage-chrome.pid
          node .github/scripts/check_birth_filter_and_geni_dedupe.mjs http://127.0.0.1:4173/ 9222
      - name: Commit the verified implementation
        run: |
          rm .github/scripts/apply_birth_filter_and_geni_dedupe.py
          rm .github/scripts/fix_birth_filter_patch_script.py
          rm .github/scripts/check_birth_filter_and_geni_dedupe.mjs
          rm .github/workflows/verify-birth-filter-and-geni-dedupe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Hide fragile births and merge Geni identities"
          git push origin HEAD:fix/hide-fragile-births-and-dedupe-geni
