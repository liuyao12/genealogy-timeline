name: Apply neutral decade palette

on:
  push:
    branches:
      - feature/neutral-decade-bands

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/neutral-decade-bands
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace decade colours and bump cache key
        shell: python
        run: |
          from pathlib import Path

          styles = Path('styles.css')
          text = styles.read_text(encoding='utf-8')
          old = '''.timeline-decade-band.tone-0 { fill: #e3e9dc; fill-opacity: .42; }
          .timeline-decade-band.tone-1 { fill: #f2e8dc; fill-opacity: .36; }
          .ruler-decade-bands .timeline-decade-band { fill-opacity: .46; }'''
          new = '''.timeline-decade-band.tone-0 { fill: #ffffff; fill-opacity: .92; }
          .timeline-decade-band.tone-1 { fill: #dfe9dc; fill-opacity: .78; }
          .ruler-decade-bands .timeline-decade-band { fill-opacity: .88; }'''
          if old not in text:
              raise SystemExit('Expected decade palette was not found')
          styles.write_text(text.replace(old, new, 1), encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          if './styles.css?v=65' not in html:
              raise SystemExit('Expected stylesheet cache key was not found')
          index.write_text(html.replace('./styles.css?v=65', './styles.css?v=66', 1), encoding='utf-8')
      - name: Run tests
        run: npm test
      - name: Verify palette
        shell: bash
        run: |
          grep -Fq '.timeline-decade-band.tone-0 { fill: #ffffff; fill-opacity: .92; }' styles.css
          grep -Fq '.timeline-decade-band.tone-1 { fill: #dfe9dc; fill-opacity: .78; }' styles.css
          grep -Fq '.ruler-decade-bands .timeline-decade-band { fill-opacity: .88; }' styles.css
          grep -Fq './styles.css?v=66' index.html
      - name: Commit verified palette
        shell: bash
        run: |
          rm .github/workflows/apply-neutral-decade-bands.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use white and light green for decade bands'
          git push origin HEAD:feature/neutral-decade-bands
