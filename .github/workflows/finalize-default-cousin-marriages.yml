name: Finalize default cousin marriages
on:
  push:
    branches: [fix/default-cousin-marriages]
    paths:
      - .github/workflows/finalize-default-cousin-marriages.yml
      - .github/scripts/resolve_henry_vii_spouse_branch_ids.py
      - .github/scripts/finish_default_cousin_marriages.py
      - .github/scripts/check_default_cousin_marriages.mjs
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/default-cousin-marriages
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate the complete default example
        run: |
          python3 .github/scripts/resolve_henry_vii_spouse_branch_ids.py
          python3 .github/scripts/expand_henry_vii_descended_spouses.py
          python3 .github/scripts/finish_default_cousin_marriages.py
          python3 - <<'PY'
          from pathlib import Path
          for path in [
              Path('tests/monarch-events.test.mjs'),
              Path('tests/royal-title-place-style.test.mjs'),
              Path('tests/side-panel-immediate-family.test.mjs'),
          ]:
              text = path.read_text(encoding='utf-8')
              text = text.replace(r'app\.js\?v=146', r'app\.js\?v=147')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Run structural and unit tests
        run: |
          npm test
          node --check app.js
          node --check royal-title-style.js
          node --check .github/scripts/check_default_cousin_marriages.mjs
          node --check .github/scripts/check_henry_vii_descended_spouses.mjs
          python3 -m json.tool data/british-royal-line.json >/dev/null
          git diff --check
      - name: Start the application and Chrome
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          for attempt in $(seq 1 80); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/lineage-default-cousin-marriages about:blank \
            >/tmp/lineage-chrome.log 2>&1 &
      - name: Verify the default filter, visible loops, collapsing, and migration
        run: |
          node .github/scripts/check_default_cousin_marriages.mjs http://127.0.0.1:4173/ 9222
          rm -rf /tmp/lineage-default-cousin-marriages
          pkill -f 'remote-debugging-port=9222' || true
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 \
            --user-data-dir=/tmp/lineage-cousin-migration about:blank \
            >/tmp/lineage-chrome-migration.log 2>&1 &
          node .github/scripts/check_henry_vii_descended_spouses.mjs http://127.0.0.1:4173/ 9223
      - name: Commit the verified default example
        run: |
          rm -f \
            .github/henry-vii-spouse-audit.txt \
            .github/henry-vii-spouse-branch-ids.json \
            .github/spouse-ancestor-geni-ids.json \
            .github/scripts/audit_henry_vii_descended_spouses.py \
            .github/scripts/check_default_cousin_marriages.mjs \
            .github/scripts/check_henry_vii_descended_spouses.mjs \
            .github/scripts/expand_henry_vii_descended_spouses.py \
            .github/scripts/finish_default_cousin_marriages.py \
            .github/scripts/resolve_henry_vii_spouse_branch_ids.py \
            .github/scripts/resolve_spouse_ancestor_geni_ids.py \
            .github/workflows/audit-henry-vii-descended-spouses.yml \
            .github/workflows/finalize-default-cousin-marriages.yml \
            .github/workflows/finalize-henry-vii-descended-spouses.yml \
            .github/workflows/persist-henry-vii-spouse-audit.yml \
            .github/workflows/resolve-spouse-ancestor-geni-ids.yml \
            .github/workflows/verify-henry-vii-descended-spouses.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add cousin marriages to the default royal example"
          git push origin HEAD:fix/default-cousin-marriages
