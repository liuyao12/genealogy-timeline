name: Diagnose household ordering

on:
  push:
    branches: [feature/timeline-band-polish]
    paths: [.github/workflows/diagnose-household-order.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render bundled tree
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/lineage-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=8000 --dump-dom http://127.0.0.1:4173/ > /tmp/lineage-dom.html
          python3 - <<'PY'
          import html
          import re

          source = open('/tmp/lineage-dom.html', encoding='utf-8').read()
          ids = {
              'Margaret Tudor': 'profile-g6000000003858820967',
              'James IV': 'profile-g4229916861440069622',
              'Archibald Douglas': 'profile-g6000000003232538566',
              'Henry Stewart': 'profile-g6000000005412245713',
              'Henry VIII': 'profile-g6000000007442241030',
          }
          rows = {}
          for tag in re.findall(r'<g\b[^>]*\btimeline-node\b[^>]*>', source):
              person = re.search(r'data-person-id="([^"]+)"', tag)
              transform = re.search(r'transform="translate\(([-\d.]+)[ ,]+([-\d.]+)\)"', tag)
              key = re.search(r'data-node-key="([^"]+)"', tag)
              if person and transform:
                  rows.setdefault(html.unescape(person.group(1)), []).append((float(transform.group(2)), html.unescape(key.group(1)) if key else ''))
          for name, person_id in ids.items():
              print(f'{name}: {sorted(rows.get(person_id, []))}')
          PY
