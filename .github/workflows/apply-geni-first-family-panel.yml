name: Apply Geni-first family panel

on:
  push:
    branches:
      - ui/geni-first-family-panel

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/geni-first-family-panel
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply selected-profile family redesign
        run: |
          python3 .github/scripts/apply_geni_first_family_panel.py
          python3 .github/scripts/fix_geni_family_oauth.py

      - name: Run tests and syntax checks
        run: |
          npm test
          node --check app.js
          node --check .github/scripts/geni_family_panel_mock.js

      - name: Build mocked browser fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          marker = '<script type="module" src="./geni-import.js?v=1"></script>'
          if index.count(marker) != 1:
              raise SystemExit(f'Expected one module marker, found {index.count(marker)}')
          index = index.replace(marker, '<script src="./.github/scripts/geni_family_panel_mock.js"></script>\n  ' + marker)
          Path('__geni-family-panel-app.html').write_text(index, encoding='utf-8')
          PY

      - name: Verify Geni-first family UX in Chromium
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=45000 --dump-dom \
            http://127.0.0.1:4173/.github/scripts/geni_family_panel_smoke.html \
            >/tmp/geni-family-panel-smoke.html
          grep -oE '(PASS|FAIL) [^<]*' /tmp/geni-family-panel-smoke.html | head -1
          grep -q 'PASS {' /tmp/geni-family-panel-smoke.html

      - name: Commit verified redesign
        shell: bash
        run: |
          rm -f __geni-family-panel-app.html
          rm -rf .github/scripts
          rm .github/workflows/apply-geni-first-family-panel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Geni the primary immediate-family action"
          git push origin HEAD:ui/geni-first-family-panel
