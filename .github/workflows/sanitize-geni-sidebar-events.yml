name: Verify Geni year-only sidebar import
on:
  push:
    branches: [refactor/geni-generation-graph]
    paths: [.github/workflows/sanitize-geni-sidebar-events.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/geni-generation-graph
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply year-only sidebar sanitization
        run: python3 .github/scripts/sanitize_geni_sidebar_events.py
      - name: Test all Geni paths
        run: |
          npm test
          node --check app.js
          node --check geni-config.js
          node --check geni-model.js
          node --check geni-api.js
          node --check geni-import-core.js
          node --check geni-import.js
      - name: Commit verified patch
        run: |
          rm .github/scripts/sanitize_geni_sidebar_events.py
          rm .github/workflows/sanitize-geni-sidebar-events.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Strip Geni event detail before sidebar merge"
          git push origin HEAD:refactor/geni-generation-graph
