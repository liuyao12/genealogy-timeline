name: Audit in-scope child branches
on:
  push:
    branches: [feature/hide-noisy-births-and-dedupe-geni]
    paths: [.github/workflows/audit-descendant-birth-candidates.yml]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hide-noisy-births-and-dedupe-geni
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Print incomplete child branches in the default focus tree
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { computeDescendantScope } from './descendant-scope.js';
          const data = JSON.parse(fs.readFileSync('data/british-royal-line.json', 'utf8'));
          const people = data.people;
          const scope = computeDescendantScope(people, data.rootId);
          const name = id => people[id]?.displayName || id;
          console.log('DESCENDANTS WITH FEWER THAN TWO STORED PARENTS');
          for (const id of scope.descendantIds) {
            if (id === data.rootId) continue;
            const parents = [...(scope.allParentsByChild.get(id) || [])];
            if (parents.length >= 2) continue;
            const spouseChoices = parents.flatMap(parentId => (people[parentId]?.spouses || []).map(spouseId => ({
              parent: name(parentId), spouse: name(spouseId), marriage: people[parentId]?.marriageYears?.[spouseId] || ''
            })));
            console.log(id, '|', name(id), '|', people[id]?.birthYear, people[id]?.deathYear, '| parents=', parents.map(name), '| parent spouses=', spouseChoices);
          }
          console.log('\nPATERNAL-HOUSEHOLD CHILDREN WITH FEWER THAN TWO STORED PARENTS');
          for (const id of scope.paternalHouseholdChildIds) {
            const parents = [...(scope.allParentsByChild.get(id) || [])];
            if (parents.length >= 2) continue;
            console.log(id, '|', name(id), '| parents=', parents.map(name));
          }
          console.log('\nCOUNTS', {
            descendants: scope.descendantIds.size,
            allowed: scope.allowedIds.size,
            incompleteDescendantChildren: [...scope.descendantIds].filter(id => id !== data.rootId && (scope.allParentsByChild.get(id)?.size || 0) < 2).length
          });
          JS
