name: Add Princess Charlotte to the starter family
on:
  push:
    branches: [data/add-princess-charlotte]
    paths:
      - .github/scripts/add_princess_charlotte.py
      - .github/scripts/check_princess_charlotte.mjs
      - .github/workflows/add-princess-charlotte.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/add-princess-charlotte
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair the bundled family
        run: python3 .github/scripts/add_princess_charlotte.py
      - name: Update starter-version and profile-count expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('tests').glob('*.test.mjs'):
              text = path.read_text(encoding='utf-8')
              updated = (
                  text
                  .replace('version 29', 'version 30')
                  .replace('starter.version, 29', 'starter.version, 30')
                  .replace('Object.keys(people).length, 186', 'Object.keys(people).length, 187')
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY
      - name: Run unit and structural checks
        run: |
          npm test
          node --check app.js
          node --check person-events.js
          node --check .github/scripts/check_princess_charlotte.mjs
          python3 -m json.tool data/british-royal-line.json >/dev/null
          git diff --check
      - name: Start the application and Chrome
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          for attempt in $(seq 1 80); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --no-first-run --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/lineage-princess-charlotte about:blank \
            >/tmp/lineage-chrome.log 2>&1 &
          CHROME_PID=$!
          for attempt in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:9222/json/list >/dev/null; then
              break
            fi
            if ! kill -0 "$CHROME_PID" 2>/dev/null; then
              cat /tmp/lineage-chrome.log
              exit 1
            fi
            sleep .1
          done
          curl -fsS http://127.0.0.1:9222/json/list >/dev/null || {
            cat /tmp/lineage-chrome.log
            exit 1
          }
      - name: Verify Charlotte in the live side panel
        run: node .github/scripts/check_princess_charlotte.mjs http://127.0.0.1:4173/ 9222
      - name: Commit the verified starter repair
        run: |
          rm -f \
            .github/scripts/add_princess_charlotte.py \
            .github/scripts/check_princess_charlotte.mjs \
            .github/workflows/add-princess-charlotte.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add Princess Charlotte to George IV's family [skip ci]"
          git push origin HEAD:data/add-princess-charlotte
