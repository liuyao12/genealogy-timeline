name: Normalize royal example names
on:
  push:
    branches: [data/normalize-royal-example-names]
    paths: [.github/workflows/normalize-royal-example-names.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/normalize-royal-example-names
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply audited royal-name corrections
        run: |
          python3 .github/scripts/finalize_royal_name_patch.py
          python3 .github/scripts/normalize_royal_example_names.py
      - name: Run automated tests and validation
        run: |
          npm test
          node --check app.js
          node --check tests/royal-name-style.test.mjs
          python3 -m json.tool data/british-royal-line.json >/dev/null
          git diff --check
      - name: Start the patched app
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          echo $! >/tmp/lineage-http.pid
          for attempt in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
      - name: Verify the corrected names in Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 --user-data-dir=/tmp/lineage-royal-name-chrome about:blank \
            >/tmp/lineage-chrome.log 2>&1 &
          echo $! >/tmp/lineage-chrome.pid
          node .github/scripts/check_royal_name_style.mjs http://127.0.0.1:4173/ 9222
      - name: Commit verified starter-data update
        run: |
          rm .github/scripts/finalize_royal_name_patch.py
          rm .github/scripts/normalize_royal_example_names.py
          rm .github/scripts/check_royal_name_style.mjs
          rm .github/workflows/normalize-royal-example-names.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize titled names in the British royal example"
          git push origin HEAD:data/normalize-royal-example-names
