name: Build side-panel life events
on:
  push:
    branches: [feature/side-panel-life-events]
    paths:
      - .github/scripts/build_side_panel_life_events.py
      - .github/workflows/build-side-panel-life-events.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/side-panel-life-events
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate the side-panel life-event implementation
        run: python3 .github/scripts/build_side_panel_life_events.py
      - name: Run unit and structural checks
        run: |
          npm test
          node --check app.js
          node --check person-events.js
          node --check .github/scripts/check_side_panel_life_events.mjs
          python3 -m json.tool data/british-royal-line.json >/dev/null
          git diff --check
      - name: Start the application and Chrome
        run: |
          python3 -m http.server 4173 >/tmp/lineage-http.log 2>&1 &
          for attempt in $(seq 1 80); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/lineage-side-panel-life-events about:blank \
            >/tmp/lineage-chrome.log 2>&1 &
      - name: Verify event rows and independent mark controls in Chrome
        run: node .github/scripts/check_side_panel_life_events.mjs http://127.0.0.1:4173/ 9222
      - name: Commit the verified implementation
        run: |
          rm -f \
            .github/scripts/build_side_panel_life_events.py \
            .github/scripts/check_side_panel_life_events.mjs \
            .github/workflows/build-side-panel-life-events.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Unify side-panel life events [skip ci]"
          git push origin HEAD:feature/side-panel-life-events
